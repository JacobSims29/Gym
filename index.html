/* ============ diet ============ */
const MEALS = ["Breakfast","Lunch","Dinner","Snacks"];
const MASS  = { g:1, oz:28.3495, lb:453.592 };                       // → grams
const VOL   = { ml:1, tbsp:14.7868, "fl oz":29.5735, cup:236.588 };  // → millilitres
const COUNT = { ct:1 };                                              // whole items; no conversions
const unitTable = base => base==="ml" ? VOL : (base==="ct" ? COUNT : MASS);
// which table a unit belongs to — so entries no longer need to store `base` alongside
const baseOf = u => VOL[u]!==undefined ? "ml" : (COUNT[u]!==undefined ? "ct" : "g");
const eBase = e => e.base || baseOf(e.unit || "g");
// per-unit rates are quotients, so they serialise as 0.028999999999999998 unless trimmed.
// Six significant figures is ~0.0001% — far below the accuracy of any food label.
const sig6 = n => { const x = +n || 0; return x ? +x.toPrecision(6) : 0; };
// Each log entry stores its own rates, so they are the single biggest thing in saved
// data. As of v12 they are a fixed-order array — same five numbers, no repeated keys.
const PER = ["cal","protein","carb","fiber","fat"];
const toPer = o => PER.map(k => sig6(o && o[k]));
const rates = e => {
  const p = e.per;
  if(Array.isArray(p)) return { cal:p[0]||0, protein:p[1]||0, carb:p[2]||0, fiber:p[3]||0, fat:p[4]||0 };
  return { cal:(p&&p.cal)||0, protein:(p&&p.protein)||0, carb:(p&&p.carb)||0, fiber:(p&&p.fiber)||0, fat:(p&&p.fat)||0 };
};
const UNIT_DEFAULT_AMOUNT = { g:100, ml:100, ct:1 };
// "180g" / "250ml" / "2 ct" — count reads better with a space
const unitLabel = (amount, u) => u==="ct" ? `${amount} ct` : `${amount}${u}`;

let dietDate = today();
let dietSub = "day";              // "day" | "foods" | "goals"
let dietRemaining = false;        // Consumed vs Remaining toggle
let dietCalOpen = false;
let addingMeal = null;            // meal name we're adding a food to
let foodFilter = "";
let foodSearch = "";              // search in the Foods management list
// AI meal scan state (all transient, none saved to D)
let aiSettingsOpen = false;
let scanImgs = [];                // up to SCAN_MAX_IMGS of {data, mediaType}
let scanMode = "meal";            // meal | recipe | label
let scanDesc = "";
let scanBusy = false;
let scanMsg = "";
let scanResult = null;            // prefills the add-food form after a scan
let mealCollapsed = {};           // meal name -> true when collapsed

const NUT = () => D.nutrition;
const round = n => Math.round(n);

// per-base-unit macros for a library food (nutrition stored for `amount` of `refUnit`)
function perBase(food){
  const a = food.amount || 1;
  return PER.map(k => sig6((+food[k]||0)/a));
}
// base-unit quantity (grams or ml) for a log entry
function entryBase(e){ const t = unitTable(eBase(e)); return (+e.qty||0) * (t[e.unit]||1); }
// macro totals for a log entry (uses the snapshot taken when it was added)
function entryMacros(e){
  const b = entryBase(e), p = rates(e);
  return { cal:b*p.cal, protein:b*p.protein, carb:b*p.carb, fiber:b*p.fiber, fat:b*p.fat };
}
function dayEntries(ds){ return NUT().log[ds] || []; }
function dayTotals(ds){
  return dayEntries(ds).reduce((t,e)=>{
    const m = entryMacros(e);
    t.cal+=m.cal; t.protein+=m.protein; t.carb+=m.carb; t.fiber+=m.fiber; t.fat+=m.fat; return t;
  }, {cal:0,protein:0,carb:0,fiber:0,fat:0});
}
function dietDots(ds){
  return (NUT().log[ds] && NUT().log[ds].length) ? `<span class="dot" style="background:var(--steps)"></span>` : "";
}

// A nested row for a component of the macro above it (fiber inside carbs).
// It keeps its own scale so the goal ticks stay usable, but is indented, thinner
// and dimmer, and states its share of the parent so the subset relation is explicit.
function subRow(label, consumed, shown, min, max, parentTotal, color){
  const scale = max>0 ? max*1.2 : 1;
  const fillPct = Math.min(100, (consumed/scale)*100);
  const minPct = (min/scale)*100, maxPct = (max/scale)*100;
  const ok = consumed>=min && (max===0 || consumed<=max);
  const share = parentTotal > 0 ? Math.round((consumed/parentTotal)*100) : null;
  return `<div class="macro sub">
    <div class="top"><span>${label}${share!=null?` <span style="color:var(--dimmer)">${share}% of carbs</span>`:""}</span>
      <span class="val">${ok?'<span class="up">✓</span> ':''}<b>${round(shown)}</b> <span style="color:var(--dimmer)">/ ${min}-${max}g</span></span>
    </div>
    <div class="mbar">
      <div style="width:${fillPct}%;background:${color}"></div>
      <span class="tick" style="left:${minPct}%"></span>
      <span class="tick" style="left:${maxPct}%"></span>
    </div>
  </div>`;
}

function macroRow(label, consumed, shown, min, max, color){
  const scale = max>0 ? max*1.2 : 1;                    // headroom so the max tick sits inside the bar
  const fillPct = Math.min(100, (consumed/scale)*100);
  const minPct = (min/scale)*100;
  const maxPct = (max/scale)*100;
  const ok = consumed>=min && (max===0 || consumed<=max);
  return `<div class="macro">
    <div class="top"><span>${label}</span>
      <span class="val">${ok?'<span class="up">✓</span> ':''}<b>${round(shown)}</b> <span style="color:var(--dimmer)">/ ${min}-${max}g</span></span>
    </div>
    <div class="mbar">
      <div style="width:${fillPct}%;background:${color}"></div>
      <span class="tick" style="left:${minPct}%"></span>
      <span class="tick" style="left:${maxPct}%"></span>
    </div>
  </div>`;
}

function viewDiet(){
  let h = `<div class="eyebrow">Nutrition</div><h2>Diet</h2><div style="height:14px"></div>`;
  h += `<div class="subseg">
    ${[["day","Day"],["foods","Foods"],["goals","Goals"]].map(([id,label])=>
      `<button class="${dietSub===id?"on":""}" onclick="setDietSub('${id}')">${label}</button>`).join("")}
  </div>`;
  if(dietSub==="foods") return h + dietFoods();
  if(dietSub==="goals") return h + dietGoals();
  return h + dietDay();
}

function dietDay(){
  const t = NUT().targets;
  const tot = dayTotals(dietDate);

  let h = `
  <div class="hdr">
    <button class="arrow" onclick="${dietCalOpen?"shiftMonth(-1)":"shiftDietDay(-1)"}">‹</button>
    <div class="mid" onclick="toggleDietCal()">
      <div class="eyebrow">${dietCalOpen ? `${MONTHS[calMonth.getMonth()]} ${calMonth.getFullYear()}` : dow(dietDate)}</div>
      <h2>${shortD(dietDate)}</h2>
      <div class="caret">${dietCalOpen ? "▲ close calendar" : "▼ pick a date"}</div>
    </div>
    <button class="arrow" onclick="${dietCalOpen?"shiftMonth(1)":"shiftDietDay(1)"}">›</button>
  </div>`;
  if(dietCalOpen) h += monthCalendar(dietDate, "pickDietDate", dietDots);

  // summary card
  const remaining = dietRemaining;
  const calScale = t.calMax>0 ? t.calMax*1.2 : 1;
  const calFill = Math.min(100, (tot.cal/calScale)*100);
  const calMinPct = (t.calMin/calScale)*100;
  const calMaxPct = (t.calMax/calScale)*100;
  const calOk = tot.cal>=t.calMin && tot.cal<=t.calMax;
  let calHead;
  if(remaining){
    const toMax = round(t.calMax - tot.cal);
    const toMin = round(t.calMin - tot.cal);
    if(tot.cal > t.calMax){
      calHead = `<span style="color:var(--bad)">${toMax}</span> <span>cal left</span>`;   // over top → negative, red
    } else if(tot.cal >= t.calMin){
      calHead = `${toMax} <span>cal left</span>`;                                          // in range → to top only
    } else {
      calHead = `${toMin}–${toMax} <span>cal left</span>`;                                  // under min → range to go
    }
  } else {
    calHead = `${round(tot.cal)} <span>/ ${t.calMin}-${t.calMax} cal</span>`;
  }
  h += `<div class="card">
    <div class="toggle">
      <button class="${!remaining?"on":""}" onclick="setRemaining(false)">Consumed</button>
      <button class="${remaining?"on":""}" onclick="setRemaining(true)">Remaining</button>
    </div>
    <div class="kcal">${calHead}</div>
    <div class="bar">
      <div style="width:${calFill}%;background:${calOk?'var(--good)':'var(--steps)'}"></div>
      <span class="tick" style="left:${calMinPct}%"></span>
      <span class="tick" style="left:${calMaxPct}%"></span>
    </div>
    ${macroRow("Protein", tot.protein, remaining?Math.max(0,t.pMax-tot.protein):tot.protein, t.pMin, t.pMax, "#c4b5fd")}
    ${macroRow("Carbs",   tot.carb,    remaining?Math.max(0,t.cMax-tot.carb):tot.carb,       t.cMin, t.cMax, "var(--good)")}
    ${subRow("Fiber", tot.fiber, remaining?Math.max(0,t.fbMax-tot.fiber):tot.fiber, t.fbMin, t.fbMax, tot.carb, "rgba(52,211,153,.55)")}
    ${macroRow("Fat",     tot.fat,     remaining?Math.max(0,t.fMax-tot.fat):tot.fat,         t.fMin, t.fMax, "var(--accent)")}
  </div>`;

  // meals
  const yesterday = iso(new Date(pd(dietDate).getTime() - 864e5));
  MEALS.forEach(meal=>{
    const entries = dayEntries(dietDate).filter(e=>e.meal===meal);
    const mt = entries.reduce((s,e)=>{ const m=entryMacros(e); s.cal+=m.cal; s.p+=m.protein; return s; }, {cal:0,p:0});
    const collapsed = !!mealCollapsed[meal];
    const yCount = dayEntries(yesterday).filter(e=>e.meal===meal).length;
    h += `<div class="meal" data-meal="${meal}">
      <div class="mh">
        <div class="mtoggle" onclick="toggleMeal('${meal}')">
          <span class="caret" style="margin:0 6px 0 0;display:inline-block">${collapsed?"▸":"▾"}</span>
          <h3 style="display:inline">${meal}</h3>
        </div>
        <div>
          <span class="pill">${round(mt.cal)} Cal</span><span class="pill p">${round(mt.p)} P</span>
          <button class="plus" onclick="startAdd('${meal}')">+</button>
        </div>
      </div>`;
    if(!collapsed){
      entries.forEach(e=>{
        const food = foodById(e.foodId);
        const m = entryMacros(e);
        h += `<div class="fitem">
          <div style="flex:1">
            <div class="fn">${esc(e.name || (food?food.name:"(deleted food)"))}</div>
            <div class="qty">
              <input class="num" type="number" inputmode="decimal" value="${esc(e.qty)}" onchange="setEntryQty('${e.id}',this.value)">
              <select onchange="setEntryUnit('${e.id}',this.value)">
                ${Object.keys(unitTable(eBase(e))).map(u=>`<option value="${u}" ${e.unit===u?"selected":""}>${u}</option>`).join("")}
              </select>
              <button class="icon" onclick="delEntry('${e.id}')">🗑</button>
            </div>
          </div>
          <div class="fm"><b>${round(m.cal)}</b> cal<br><span style="color:var(--dimmer)">${round(m.protein)}g protein</span></div>
        </div>`;
      });
      if(!entries.length && yCount){
        h += `<div class="copyrow"><button class="ghost" onclick="copyYesterdayMeal('${meal}')">＋ Copy yesterday's ${meal} (${yCount})</button>
          <div class="sub" style="text-align:center;margin-top:6px">or swipe right on this meal</div></div>`;
      }
      if(entries.length > 1 && addingMeal !== meal){
        h += `<div class="copyrow"><button class="ghost" onclick="saveMealTemplate('${meal}')">Save these ${entries.length} as a template</button></div>`;
      }
      if(addingMeal===meal) h += addPicker(meal);
    }
    h += `</div>`;
  });

  return h;
}

// food ids logged most recently, newest first — quick picks once the library is big
function recentFoodIds(n){ return logStats().order.slice(0, n); }

function addPicker(meal){
  const all = allFoods(), term = foodFilter.trim().toLowerCase();
  let h = `<div class="addbox">`;
  const tpls = D.mealTemplates || [];
  if(tpls.length && !term){
    h += `<div class="sub" style="margin-bottom:6px">Templates</div>
      <div class="row" style="flex-wrap:wrap;margin-bottom:10px">` + tpls.map(t =>
        `<button class="ghost" style="flex:0 1 auto" onclick="applyMealTemplate('${t.id}','${meal}')">${esc(t.name)} <span class="sub">· ${t.items.length}</span></button>`
      ).join("") + `</div>`;
  }
  h += `<input type="text" id="dietFilter" placeholder="Search foods…" value="${esc(foodFilter)}" oninput="setFoodFilter(this.value)">`;
  let foods = [], heading = "";
  if(!all.length){
    h += `<p class="sub" style="margin-top:8px">${libState==="loading" ? "Loading the food library…" : "No foods yet. Add some on the Foods tab first."}</p>`;
  } else if(!term){
    // a 500-food library makes an unfiltered alphabetical list useless, so show
    // what you actually eat and let typing do the rest
    const rec = recentFoodIds(8).map(id => foodById(id)).filter(Boolean);
    if(rec.length){ foods = rec; heading = "Recent"; }
    else if(all.length <= 30) foods = all.slice(0,20);
    else h += `<p class="sub" style="margin-top:8px">Type to search your ${all.length} foods.</p>`;
  } else {
    foods = searchFoods(term, 20).list;
    if(!foods.length) h += `<p class="sub" style="margin-top:8px">No matches.</p>`;
  }
  if(heading) h += `<div class="eyebrow" style="color:var(--dimmer);margin:10px 2px 2px">${heading}</div>`;
  foods.forEach(f=>{
    const u = f.refUnit || "g";
    h += `<div class="pickrow">
      <div><div class="fn">${esc(f.name)}</div><div class="fq">adds ${esc(unitLabel(f.amount, u))} · ${round(+f.cal||0)} cal · ${round(+f.protein||0)}p</div></div>
      <button class="padd" onclick="addEntry('${meal}','${f.id}')">Add</button>
    </div>`;
  });
  h += `<button class="ghost" style="margin-top:10px" onclick="cancelAdd()">Done</button></div>`;
  return h;
}

function aiScanCard(){
  let h = `<div class="foodcard">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>📷 Scan a meal <span class="sub" style="font-weight:400">(AI estimate)</span></b>
      <button class="icon" onclick="toggleAiSettings()">⚙</button>
    </div>`;

  if(aiSettingsOpen || !aiKey){
    h += `<p class="sub" style="margin:8px 0">Uses your own Anthropic API key. It's stored only on this device and is never included in backups.</p>
      <input type="password" id="aiKeyInput" placeholder="Anthropic API key (sk-ant-…)" value="${esc(aiKey)}" style="margin-bottom:8px">
      <div class="row">
        <button class="primary grow" onclick="saveAiKey()">Save</button>
        ${aiKey ? `<button class="ghost" onclick="clearAiKey()">Remove key</button>` : ""}
      </div>`;
    return h + `</div>`;
  }

  // key present: scan controls
  h += `<div class="sub" style="margin:6px 0 10px">Model: ${AI_LABEL} · roughly a cent per scan</div>`;
  h += `<div class="row" style="margin-bottom:10px">` + SCAN_MODES.map(([k,label]) =>
    `<button class="${scanMode===k?"primary":"ghost"} grow" onclick="setScanMode('${k}')">${label}</button>`).join("") + `</div>`;

  h += `<input type="file" accept="image/*" id="scanFile" class="hide" onchange="onScanFile(event)">`;
  if(scanImgs.length){
    h += `<div class="row" style="margin-bottom:8px">` + scanImgs.map((im,i) =>
      `<img src="data:${im.mediaType};base64,${im.data}" alt="scan ${i+1}" onclick="dropScanImg(${i})"
            style="flex:1;min-width:0;height:96px;object-fit:cover;border-radius:8px">`).join("") + `</div>`;
    if(scanImgs.length > 1) h += `<p class="sub" style="margin:0 0 8px">Tap an image to remove it.</p>`;
  }

  const multiline = scanMode === "recipe";
  h += multiline
    ? `<textarea id="scanDesc" rows="3" placeholder="Paste the recipe here, or photograph it above and use this box for what you changed — e.g. used 2 lb chicken not 1, skipped the butter, made 6 servings" oninput="setScanDesc(this.value)" style="margin-bottom:8px">${esc(scanDesc)}</textarea>`
    : `<input type="text" id="scanDesc" placeholder="${scanMode==="label"?"Anything the panel cuts off, e.g. serving is 2 cookies":"Short description, e.g. chicken bowl ~2 cups"}" value="${esc(scanDesc)}" oninput="setScanDesc(this.value)" style="margin-bottom:8px">`;

  const canRun = scanImgs.length > 0 || (scanMode === "recipe" && scanDesc.trim().length > 20);
  h += `<div class="row">
    ${scanImgs.length < SCAN_MAX_IMGS ? `<button class="ghost grow" onclick="document.getElementById('scanFile').click()">${scanImgs.length?"Add another":"Choose or take a photo"}</button>` : ""}
    ${canRun ? `<button class="primary grow" ${scanBusy?"disabled":""} onclick="runScan()">${scanBusy?"Working…":"Estimate nutrition"}</button>` : ""}
  </div>`;
  if(scanMode === "recipe")
    h += `<p class="sub" style="margin-top:8px">Reads the ingredients, converts volumes to weights, and divides by the serving count. You get one serving by weight, so a bigger or smaller portion scales from it. Anything you type about changes you made overrides the recipe.</p>`;
  if(scanMode === "label")
    h += `<p class="sub" style="margin-top:8px">Transcribes the panel rather than estimating, so this is the most accurate of the three. Get the serving size line in the shot.</p>`;
  if(scanMsg) h += `<p class="sub" style="margin-top:8px;color:${scanMsg.startsWith("Scan failed")?"var(--bad)":"var(--good)"}">${esc(scanMsg)}</p>`;
  return h + `</div>`;
}

/* ---- food library -------------------------------------------------------
   The shipped library (starter-foods.json) is loaded into memory at startup and
   mirrored to its own localStorage key so it survives offline. It is never part of D,
   so its size no longer taxes every save. Saved data holds only: foods you created,
   foods you edited (a copy that keeps the library id, so logged entries still resolve),
   and `nutrition.hidden` — library ids you deleted.                              */
let LIB = [];                         // in-memory library rows, pre-sorted
let LIB_BY_ID = new Map();
let libState = "idle";                // idle | loading | ready | error
let libMsg = "", libFrom = "";
let libDocVersion = null, libLoadedAt = null;   // what landed, and when
let libDropped = null;                // rows reconcileSeeds() removed on this load
const SEED_URL = "starter-foods.json";
const FOOD_RESULTS = 25;              // max food cards rendered for one search

const normName = s => String(s||"").trim().toLowerCase();

/* ---- search ------------------------------------------------------------
   Ranking is by how closely the name matches what was typed, not by score
   soup. Each name is reduced once, at load, to a comparison form: the leading
   "Generic " dropped, punctuation flattened to spaces, lowercased. A query is
   reduced the same way, then every candidate falls into exactly one tier:

     exact -> exact but for a plural -> starts with, on a word boundary
           -> starts with, mid-word -> contains it as a whole word
           -> contains it anywhere -> every word present -> every word as a prefix

   Within a tier the shorter name wins, so for "egg": "egg" then "eggs" then
   "egg roll" then "egg salad sandwich, with lettuce". A twelve-word name that
   happens to end with your two words cannot outrank a two-word name that starts
   with them, whatever else is true about it.

   Plurals are handled by matching the query and its s/es forms, not by stemming
   everything: that keeps "eggs" close to "egg" without pulling "eggnog" in with
   them.

   One thing outranks string shape: having eaten it. Anything you have logged
   before is lifted out of its tier into a band sitting just below the two exact
   tiers, so a food already in your history beats a stranger that merely starts
   with the same letters.                                                       */

const cmpForm = name => String(name||"")
  .replace(/^generic\s+/i, "")
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, " ")
  .trim();

// A crude singulariser, used only for the last-resort tier: it is what connects
// "egg" to "scrambled eggs" when nothing closer matched.
const TOKEN = /[a-z0-9]+/g;
function singular(w){
  if(w.length > 4 && w.endsWith("ies")) return w.slice(0,-3) + "y";
  if(w.length > 4 && /(s|x|z|ch|sh)es$/.test(w)) return w.slice(0,-2);
  if(w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0,-1);
  return w;
}
function tokenize(str){
  const raw = String(str||"").toLowerCase().match(TOKEN) || [];
  const out = [];
  for(const w of raw){ if(w !== "generic") out.push(singular(w)); }
  return out;
}
const searchBlob = name => " " + tokenize(name).join(" ") + " ";
// "Generic chicken breast" files under C, not G — otherwise the whole library
// collapses into one letter and the alphabetical list stops being useful
const sortKey = f => String(f.name||"").replace(/^generic\s+/i, "").toLowerCase();
function sortFoods(){ NUT().foods.sort((a,b)=>sortKey(a).localeCompare(sortKey(b))); }

// FNV-1a over the normalised name: short, and stable across reloads and rebuilds of the
// file, so a logged entry keeps pointing at the same food. Row order is irrelevant except
// for the collision tiebreak below, which for 500 rows is ~1-in-30,000 to ever be reached.
function libId(name){
  let h = 0x811c9dc5;
  const t = normName(name);
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return "lib:" + (h>>>0).toString(36);
}

// derived fields used by sorting and search; computed once, never saved
function decorate(f){
  f._n = normName(f.name);
  f._k = sortKey(f);
  f._m = cmpForm(f.name);                 // what search compares against
  f._p = " " + f._m + " ";                // padded, so word-boundary tests are one indexOf
  f._s = searchBlob(f.name);              // stemmed words, for the plural fallback only
  return f;
}

function buildLib(rows){
  const out = [], taken = new Set();
  rows.forEach(r => {
    const [name, amount, unit, cal, protein, carb, fiber, fat] = r;
    if(!name) return;
    let id = libId(name), k = 1;
    while(taken.has(id)) id = libId(name) + "." + (k++);
    taken.add(id);
    const f = { id, name:String(name), amount:+amount||100, refUnit:unit||"g",
                cal:+cal||0, protein:+protein||0, carb:+carb||0, fiber:+fiber||0, fat:+fat||0 };
    decorate(f);
    out.push(f);
  });
  out.sort((a,b)=>a._k.localeCompare(b._k));
  LIB = out;
  LIB_BY_ID = new Map(out.map(f => [f.id, f]));
  invalidateFoods();
}

async function loadLibrary(force){
  libState = "loading"; libMsg = ""; render();
  const v = new URLSearchParams(location.search).get("v") || "1";
  // A forced reload has to change the URL, not just the request's cache mode. The page
  // and the JSON share one ?v=, so re-requesting the same URL can still be answered
  // from the GitHub Pages CDN edge inside its TTL — and iOS ignores cache:"reload"
  // outright in a standalone home-screen app. A unique query string cannot be cached
  // by anything, because nothing has ever seen it.
  const url = SEED_URL + "?v=" + encodeURIComponent(v) + (force ? "&t=" + Date.now() : "");
  const before = LIB.length;
  try{
    const res = await fetch(url, { cache: force ? "reload" : "default" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const doc = await res.json();
    const rows = Array.isArray(doc.foods) ? doc.foods : [];
    if(!rows.length) throw new Error("the file contained no foods");
    buildLib(rows);
    libFrom = "network";
    libDocVersion = doc.version != null ? doc.version : null;
    libLoadedAt = new Date();
    const dropped = reconcileSeeds();
    if(dropped) libDropped = dropped;          // stay quiet when there was nothing to do
    libState = "ready";
    if(force) libMsg = before === LIB.length
      ? `Reloaded — still ${commas(LIB.length)} foods. If you just changed the file, the deploy may not have landed yet.`
      : `Reloaded — ${commas(before)} → ${commas(LIB.length)} foods.`;
  }catch(ex){
    // No local mirror: the app itself has to come off the network anyway, so a copy
    // in localStorage only covered the case where the HTTP cache kept index.html and
    // dropped the JSON — narrow cover for 11% of the storage budget.
    libState = "error";
    libMsg = "Couldn't load the library (" + ex.message + "). It has to be served next to index.html; it won't load from a local file preview.";
  }
  render();
}

// One-time cleanup of data written before the library moved out of D. A saved copy of a
// library food is redundant unless you edited it: entries carry their own rates, so a
// logged one only needs its foodId repointed at the identical library row. Values in the
// log are never touched. Safe to run repeatedly; a no-op once there is nothing to move.
function reconcileSeeds(){
  const n = NUT();
  const byName = new Map(LIB.map(f => [f._n, f]));
  const same = (a,b) => (+a.amount||0)===(+b.amount||0) && (a.refUnit||"g")===(b.refUnit||"g")
    && ["cal","protein","carb","fiber","fat"].every(k => (+a[k]||0)===(+b[k]||0));
  const remap = new Map();
  (n.foods||[]).forEach(f => {
    if(f.src !== "seed") return;                      // yours, or already reconciled
    const twin = byName.get(normName(f.name));
    if(twin && same(f, twin)) remap.set(f.id, twin.id);   // untouched copy of a library row
  });
  if(!remap.size) return 0;
  Object.keys(n.log||{}).forEach(ds => (n.log[ds]||[]).forEach(e => {
    const to = remap.get(e.foodId);
    if(to) e.foodId = to;                             // pointer only; qty, name and rates stay put
  }));
  invalidateLogStats();
  n.foods = n.foods.filter(f => !remap.has(f.id));
  invalidateFoods(); save();
  return remap.size;
}

/* merged view -------------------------------------------------------------
   Pickers and search read `allFoods()`: your foods, plus library foods that aren't
   shadowed (same id after an edit, or same name from the old seed import) and aren't
   hidden. Rebuilt only when something changes, so a keystroke costs a filter, not a sort. */
let foodsCache = null;
function invalidateFoods(){ foodsCache = null; }
function allFoods(){
  if(foodsCache) return foodsCache;
  const mine = (NUT().foods||[]).map(f => { const c = decorate(Object.assign({}, f)); c._mine = true; return c; });
  mine.sort((a,b)=>a._k.localeCompare(b._k));
  const shadow = new Set(NUT().hidden||[]);
  const names = new Set();
  mine.forEach(f => { shadow.add(f.id); names.add(f._n); });
  // both inputs are already sorted, so merge them: n comparisons rather than the
  // n log n a re-sort costs, which matters because this runs on every food edit
  const out = [];
  let i = 0, j = 0;
  while(i < mine.length || j < LIB.length){
    if(j < LIB.length && (shadow.has(LIB[j].id) || names.has(LIB[j]._n))){ j++; continue; }
    if(i >= mine.length) out.push(LIB[j++]);
    else if(j >= LIB.length) out.push(mine[i++]);
    else out.push(mine[i]._k.localeCompare(LIB[j]._k) <= 0 ? mine[i++] : LIB[j++]);
  }
  foodsCache = out;
  return out;
}

/* How often and how recently each food has been logged. Foods you actually eat
   should outrank the rest of a 5,000-row library on any query they match. */
let logStatsCache = null;
function invalidateLogStats(){ logStatsCache = null; }
function logStats(){
  if(logStatsCache) return logStatsCache;
  const w = new Map(), order = [], seen = new Set();
  const log = NUT().log || {}, now = pd(today()).getTime();
  Object.keys(log).sort().reverse().forEach(ds => {
    const age = Math.max(0, (now - pd(ds).getTime())/864e5);
    (log[ds]||[]).slice().reverse().forEach(e => {
      if(!e.foodId) return;
      if(!seen.has(e.foodId)){ seen.add(e.foodId); order.push(e.foodId); }
      const bump = 1 + (age <= 14 ? 1.5 : age <= 60 ? 0.6 : 0);
      w.set(e.foodId, (w.get(e.foodId)||0) + bump);
    });
  });
  const score = new Map();
  w.forEach((v,k) => score.set(k, Math.min(10, 3 + 2.2*Math.log2(1+v))));
  logStatsCache = { score, order };
  return logStatsCache;
}

// the query as typed, plus its singular and plural forms
function queryForms(q){
  const one = singular(q), out = [q];
  const add = v => { if(v && out.indexOf(v) < 0) out.push(v); };
  add(one); add(one + "s"); add(one + "es"); add(q + "s");
  return out;
}

// Which tier a name falls into for this query; lower is closer, null is no match.
// The words exactly as typed are exhausted before their singular/plural forms are
// tried, so "eggs" reaches "scrambled eggs" before it reaches "egg roll".
const TIER_NAMES = [
  "exact", "exact but for a plural", "starts with what you typed",
  "contains it as a word", "starts with it mid-word",
  "starts with its singular or plural", "contains its singular or plural",
  "contains it anywhere", "has every word", "has every word as a prefix",
  "related word"
];
function foodTier(f, q, forms, words, stems){
  const m = f._m, p = f._p;
  if(m === q) return 0;
  for(const v of forms) if(m === v) return 1;                          // "oats" for "oat"
  if(m.startsWith(q) && m.charAt(q.length) === " ") return 2;          // "egg roll"
  if(p.indexOf(" " + q + " ") >= 0) return 3;                          // "scrambled eggs" for "eggs"
  if(m.startsWith(q)) return 4;                                        // "eggnog", "eggplant"
  for(const v of forms)
    if(m.startsWith(v) && m.charAt(v.length) === " ") return 5;
  for(const v of forms) if(p.indexOf(" " + v + " ") >= 0) return 6;
  if(m.indexOf(q) >= 0) return 7;
  let all = true;
  for(const w of words) if(p.indexOf(" " + w + " ") < 0){ all = false; break; }
  if(all) return 8;                                                    // every word, any order
  all = true;
  for(const w of words) if(p.indexOf(" " + w) < 0){ all = false; break; }
  if(all) return 9;                                                    // "chick brea"
  all = true;
  for(const w of stems) if(f._s.indexOf(" " + w) < 0){ all = false; break; }
  return all ? 10 : null;                                              // berry/berries
}

// Foods you have logged before sit in a band of their own, immediately behind the
// two exact tiers and ahead of everything ranked on string shape alone. Inside the
// band the order is how often you have eaten it, then how close the match was.
const LOGGED_BAND = 1.5;

function searchFoods(term, limit){
  const q = cmpForm(term);
  if(!q) return { total:0, list:[], tier:null };
  const words = q.split(" ");
  const forms = queryForms(q);
  const stems = tokenize(term);
  const all = allFoods(), st = logStats(), hits = [];
  for(let i = 0; i < all.length; i++){
    const f = all[i];
    const t = foodTier(f, q, forms, words, stems);
    if(t === null) continue;
    const eaten = st.score.get(f.id) || 0;
    hits.push([(t > 1 && eaten > 0) ? LOGGED_BAND : t, eaten, t, f]);
  }
  // band, then how often you eat it, then how close the match is, then the shorter
  // name, then alphabetical
  hits.sort((a,b) =>
    a[0] - b[0] ||
    b[1] - a[1] ||
    a[2] - b[2] ||
    a[3]._m.length - b[3]._m.length ||
    a[3]._k.localeCompare(b[3]._k));
  return { total: hits.length, list: hits.slice(0, limit).map(h => h[3]),
           tier: hits.length ? hits[0][2] : null };
}
function foodById(id){
  return (NUT().foods||[]).find(f=>f.id===id) || LIB_BY_ID.get(id) || null;
}
const isMine = id => (NUT().foods||[]).some(f=>f.id===id);

// Editing a library food makes a saved copy that keeps the same id, so anything already
// logged against it still resolves, and the library row is shadowed rather than duplicated.
function promote(id){
  const mine = (NUT().foods||[]).find(x=>x.id===id);
  if(mine) return mine;
  const src = LIB_BY_ID.get(id);
  if(!src) return null;
  const copy = { id:src.id, name:src.name, amount:src.amount, refUnit:src.refUnit,
                 cal:src.cal, protein:src.protein, carb:src.carb, fiber:src.fiber, fat:src.fat, src:"lib" };
  NUT().foods.push(copy); sortFoods(); invalidateFoods();
  return copy;
}
function restoreHidden(){
  NUT().hidden = [];
  invalidateFoods(); save(); render();
}
function pruneSeedCopies(){
  const n = reconcileSeeds();
  libDropped = n;
  render();
}

function mealTemplateCard(){
  const tpls = D.mealTemplates || [];
  if(!tpls.length) return `<div class="card">
    <div class="lift"><h3>Meal templates</h3><span class="last">none yet</span></div>
    <p class="sub" style="margin-top:6px">A meal you eat often, saved whole. Log one on the Day tab, then use “Save these N as a template” under it — after that it is one tap from the ＋ on any meal.</p>
  </div>`;
  let h = `<div class="card">
    <div class="lift"><h3>Meal templates</h3><span class="last">${tpls.length}</span></div>
    <p class="sub" style="margin:6px 0 10px">Add one from the ＋ on any meal. Items follow later edits to the underlying food.</p>`;
  tpls.forEach(t => {
    const cal = t.items.reduce((a,it) => {
      const f = foodById(it.foodId);
      const per = f ? perBase(f) : it.per;
      return a + entryBase({ qty:it.qty, unit:it.unit }) * (Array.isArray(per) ? per[0] : (per&&per.cal)||0);
    }, 0);
    h += `<div class="list-row">
      <span style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(t.name)}
        <span class="sub">· ${t.items.length} item${t.items.length===1?"":"s"} · ${round(cal)} cal</span></span>
      <button class="icon" onclick="delMealTemplate('${t.id}')">🗑</button>
    </div>`;
  });
  return h + `</div>`;
}

function libraryCard(){
  const mineCount = (NUT().foods||[]).length;
  const seeds = (NUT().foods||[]).filter(f=>f.src==="seed").length;
  const hid = (NUT().hidden||[]).length;
  const status = libState==="loading" ? "loading…"
               : libState==="ready" ? `${commas(LIB.length)} foods`
               : "not loaded";
  const stamp = libState === "ready" && libLoadedAt
    ? `Loaded ${libLoadedAt.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}${
        libDocVersion != null ? ` · file version ${esc(String(libDocVersion))}` : ""}`
    : "";
  let h = `<div class="card">
    <div class="lift"><h3>Food library</h3><span class="last">${status}</span></div>
    <p class="sub" style="margin:6px 0 10px">Common US foods from USDA FoodData Central, loaded from <span class="mono">starter-foods.json</span> into memory each time the app opens. It isn't stored in your saved data, so it costs nothing to keep and nothing to back up. It is fetched fresh each time the app opens, which needs a connection. Editing one saves your version; deleting one hides it. Row-by-row sourcing sits in <span class="mono">starter-foods-provenance.json</span>, which the app never loads.</p>
    ${stamp ? `<div class="sub mono" style="margin-bottom:8px;color:var(--dimmer)">${stamp}</div>` : ""}
    <div class="sub" style="margin-bottom:10px">Your own foods: ${mineCount}${seeds ? ` · ${seeds} saved copies from the old import` : ""}${hid ? ` · ${hid} hidden` : ""}</div>
    <button class="ghost" ${libState==="loading"?"disabled":""} onclick="loadLibrary(true)">${libState==="loading"?"Loading…":"Reload library"}</button>`;
  if(seeds) h += `<button class="ghost" style="margin-top:8px" onclick="pruneSeedCopies()">Drop saved copies the library already provides</button>`;
  if(hid) h += `<button class="ghost" style="margin-top:8px" onclick="restoreHidden()">Restore ${hid} hidden food${hid===1?"":"s"}</button>`;

function saveMealTemplate(meal){
  const entries = dayEntries(dietDate).filter(e => e.meal === meal);
  if(!entries.length) return;
  const name = (prompt("Name this meal", meal) || "").trim();
  if(!name) return;
  D.mealTemplates.push({
    id: uid("mt"), name,
    items: entries.map(e => ({ foodId:e.foodId, name:e.name, qty:e.qty, unit:e.unit, per:e.per }))
  });

function applyMealTemplate(id, meal){
  const t = (D.mealTemplates||[]).find(x => x.id === id);
  if(!t) return;
  if(!NUT().log[dietDate]) NUT().log[dietDate] = [];
  t.items.forEach((it, k) => {
    const f = foodById(it.foodId);
    // if the food has since changed between mass, volume and count, the saved unit
    // no longer applies — fall back to the food's own reference portion
    let unit = it.unit, qty = it.qty, per = it.per;
    if(f){
      per = perBase(f);
      if(baseOf(unit) !== baseOf(f.refUnit || "g")){ unit = f.refUnit || "g"; qty = f.amount || 100; }
    }
    NUT().log[dietDate].push({
      id: uid("e"), foodId: it.foodId, name: f ? f.name : it.name,
      meal, qty, unit, per
    });
  });
  addingMeal = null; mealCollapsed[meal] = false;
  invalidateLogStats(); save(); render();
}

function imgToBase64(file, maxDim){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Couldn't read that image."));
    fr.onload = e => {
      const img = new Image();
      img.onerror = () => rej(new Error("That file isn't an image."));
      img.onload = () => {
        const s = Math.min(1, maxDim/Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        const url = c.toDataURL("image/jpeg", 0.8);
        res({ data: url.split(",")[1], mediaType: "image/jpeg" });
      };
      img.src = e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

const SCAN_MAX_IMGS = 3;
const SCAN_MODES = [
  ["meal",   "Meal photo", "a plated meal"],
  ["recipe", "Recipe",     "a recipe, screenshot or pasted"],
  ["label",  "Label",      "a Nutrition Facts panel"]
];

/* The three modes are different jobs, not different phrasings of one job: a meal
   photo needs portion estimation, a recipe needs arithmetic and a serving divisor,
   a label needs transcription and no estimation at all. They share one output
   contract so the add-food form can be filled the same way from any of them.   */
const SCAN_CONTRACT =
`Think it through first if the task needs it, then end your reply with a JSON object as the very last thing — no fences, no text after it — in exactly this shape:
{"name": string, "amount": number, "unit": "g" | "ml", "calories": number, "protein_g": number, "carb_g": number, "fiber_g": number, "fat_g": number, "servings": number or null, "saw": "meal" | "recipe" | "label" | "unclear", "basis": string, "note": string}
"unit" is always a weight or a volume, never a count: use "ml" for drinks and other things measured by volume, "g" for everything else. If the thing is naturally counted — a bar, a cookie, two tacos — give the weight of it in grams anyway, and say what that count was in "note".
The macro numbers are the totals for ONE "amount" of "unit" — never per 100 g unless amount is 100, and never for a whole recipe or package unless that is the one thing being logged. "fiber_g" is the dietary fiber contained within "carb_g", not in addition to it. "saw" is what the image or text actually turned out to be, which may not be what you were asked for. "basis" is the short working you used, under 25 words. "note" is anything the user should check, under 20 words. If unsure, still commit to one best estimate.`;

const SCAN_SYSTEM = {
  meal:
`You estimate nutrition from a photo of a meal, plus whatever description the user typed.
Judge the portion from the plate, bowl or container, and from any utensil or hand for scale. Set "unit" to "g" and "amount" to the total edible weight you estimate — bones, shells, rinds and packaging excluded. Set "servings" to null.
` + SCAN_CONTRACT,

  recipe:
`You read a recipe — a screenshot, a photo of a page, or text the user pasted — and work out the nutrition of ONE SERVING.
Method: list the ingredients with their stated quantities, convert every volume to a weight using standard densities, total the macros and the cooked weight, then divide both by the number of servings the recipe states. If it states no serving count, choose a sensible one and say which in "note". Put the servings figure in "servings".
Count only what is eaten: subtract marinade that is discarded, oil left in the pan, and water that boils off. Do not subtract water for anything absorbed, such as rice or pasta.
The user may describe changes they made — a substitution, a different quantity, an extra ingredient, a different yield, or a step skipped. Apply them. Where the user's text and the recipe disagree, the user is right, and "basis" must say what you changed.
If the user says how much of it they ate, do not fold that into the numbers: keep the entry defined as one serving and put their portion in "note" so they can enter it when logging.
Set "amount" to the weight of one serving and "unit" to "g", or to "ml" if the dish is a drink. Name the dish as the recipe names it.
` + SCAN_CONTRACT,

  label:
`You transcribe a Nutrition Facts panel from a photo. This is transcription, not estimation: copy the printed numbers and do not adjust them.
Set "amount" and "unit" to the serving size exactly as declared in grams or millilitres — US panels almost always print this in parentheses after the household measure. If the panel gives only a household measure such as "1 bar" or "2 cookies", estimate its weight in grams, and say in "note" both the household measure and that its weight is your estimate. Set "servings" to the servings per container.
If the panel is cut off or unreadable in part, say which numbers you had to infer in "note".
` + SCAN_CONTRACT
};

// The role and the output contract are fixed per mode, so they belong in `system`.
// Only the images and the typed text vary, so only those are messages.
async function callVision(imgs, desc, mode){
  const content = imgs.map(im => ({ type:"image", source:{ type:"base64", media_type: im.mediaType, data: im.data } }));
  content.push({ type:"text", text: (mode === "recipe" ? "Recipe text or notes from the user: " : "User description: ")
                                    + (desc.trim() || "(none provided)") });
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": aiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: AI_MODEL,
      max_tokens: mode === "meal" ? 500 : 1200,   // adding up a recipe needs room to work
      system: SCAN_SYSTEM[mode] || SCAN_SYSTEM.meal,
      messages: [{ role:"user", content }]
    })
  });
  if(!res.ok){
    let msg = "HTTP " + res.status;
    try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(_){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  const parsed = lastJson(text);
  const unit = parsed.unit === "ml" ? "ml" : "g";     // weight or volume, never a count
  return {
    name: String(parsed.name || "Scanned item"),
    unit,
    amount: Math.max(1, Math.round(Number(parsed.amount) || 100)),
    cal: Math.round(Number(parsed.calories) || 0),
    protein: Math.round(Number(parsed.protein_g) || 0),
    carb: Math.round(Number(parsed.carb_g) || 0),
    fiber: Math.round(Number(parsed.fiber_g) || 0),
    fat: Math.round(Number(parsed.fat_g) || 0),
    servings: Number(parsed.servings) > 0 ? Number(parsed.servings) : null,
    saw: String(parsed.saw || ""),
    basis: String(parsed.basis || ""),
    note: String(parsed.note || ""),
    mode
  };
}

// The model is allowed to reason before answering, so the object we want is the last
// one in the reply. Walk the opening braces backwards until one of them parses.
function lastJson(text){
  const t = text.replace(/```json|```/g, "");
  for(let i = t.lastIndexOf("{"); i >= 0; i = t.lastIndexOf("{", i - 1)){
    const tail = t.slice(i);
    try{ return JSON.parse(tail.trim()); }catch(e){}
    const end = tail.lastIndexOf("}");
    if(end > 0){ try{ return JSON.parse(tail.slice(0, end + 1)); }catch(e){} }
    if(i === 0) break;
  }
  throw new Error("the reply contained no JSON object");
}

async function runScan(){
  if(!aiKey){ scanMsg = "Enter your API key first (⚙)."; render(); return; }
  if(!scanImgs.length && !(scanMode === "recipe" && scanDesc.trim())){
    scanMsg = scanMode === "recipe" ? "Add a photo or paste the recipe first." : "Add a photo first.";
    render(); return;
  }
  scanBusy = true;
  scanMsg = (scanMode === "recipe" ? "Working through the recipe with " : "Analyzing with ") + AI_LABEL + "…";
  render();
  try{
    const mode = scanMode;
    const r = await callVision(scanImgs, scanDesc, mode);
    scanResult = r;
    scanImgs = []; scanDesc = ""; scanBusy = false;
    const bits = [];
    if(r.saw && r.saw !== "unclear" && r.saw !== mode)
      bits.push("that looked like " + r.saw + ", not " + mode + " — check the numbers");
    if(r.servings) bits.push("recipe makes " + r.servings + (mode === "label" ? " per container" : " servings"));
    if(r.note) bits.push(r.note);
    scanMsg = bits.length ? ("Ready — " + bits.join(" · ")) : "Ready — review and Add food below.";
    render();
  }catch(ex){
    scanBusy = false;
    scanMsg = "Scan failed: " + (ex.message || "try again") + ". This is an estimate feature — check your key and connection.";
    render();
  }
}

const COACH_SYSTEM =
`You are a single trusted expert combining three roles: a licensed physical therapist, a registered dietitian, and a science-based strength & conditioning coach. You give evidence-based, practical, specific guidance.

You will receive a compiled summary of the user's full logged history: bodyweight and its trend, nutrition targets and adherence, and training sessions with per-exercise volume, plus the user's written goals. You may also receive the analyses you wrote in previous sessions. Treat those as your own memory: check whether your earlier recommendations were followed and what happened, say plainly when something you predicted or prescribed did not work, and build on that advice instead of restating it. Analyses are run roughly every two weeks, so the window since your last one is the main thing to judge.

Deliver, in clear structured sections with short headers:
1. Progress — where they are versus their goals, reading the bodyweight trend and adherence honestly.
2. What's working / what's not.
3. Recommendations — be concrete and numeric: suggest specific calorie and macronutrient target ranges (give numbers), training adjustments (volume, exercise selection, progression, frequency), and recovery. Tie advice to their stated goals.

Programming standards — apply these as your defaults, and say so when you deviate for a reason. They are reference, not a script: cite only the parts that bear on what you are recommending, and never recite the whole framework back.

Diet phases:
- A fat loss phase targets 0.5–1% of total bodyweight lost per week, runs 8–12 weeks, and gives up no more than 10% of total bodyweight in one run. Follow it with 4–8 weeks at maintenance, then 1–2 weeks of active rest.
- A muscle gain phase runs 8–20 weeks, followed by a 3–6 week minicut. That gain-then-minicut cycle can repeat up to twice. After it: 1–2 weeks of active rest or 3–4 weeks at maintenance, then a 4–8 week fat loss phase.
- Rate of gain during a surplus depends on training age. First year of training: about 2% of bodyweight per month on a 300–500 kcal surplus. Intermediate: about 1% per month. Advanced, meaning five or more years of consistent training: about 0.5% per month.
- Macros have exactly two hard floors: fat at least 0.3 g per lb of bodyweight, and protein between 0.7 and 1 g per lb. Everything left over is carbs versus fat by preference — do not present a particular split as though it were required.
- When they change phase, tell them to expect a water weight shift. Moving from a deficit to maintenance typically adds a couple to a few pounds within the first week; their true maintenance weight is what the scale settles at after that spike, not the number on the last day of the deficit.
- Drive calorie changes off the gap between observed and target rate of change, not off a computed maintenance figure: a rate error is measured, whereas maintenance carries an assumed energy density. When the rate is outside the band, move intake by roughly 150 kcal and re-measure rather than recalculating from scratch. Use the measured maintenance figure above as a cross-check, and only when its interval is tight.
- While in a deficit or a surplus, adjust calories against observed rate of change and activity, and name the confound when you see one. If weight is dropping faster than target and step count has climbed at the same time, say so and offer both levers: fewer steps, or more calories.

Training:
- Build around compound lifts, and train every major muscle group each week. If they name muscle groups to prioritize, build the program around that priority — and still insist every group gets trained to some degree.
- Sets of 5–10 hard reps with good form serve both strength and hypertrophy. Beginners need not train to failure and should average roughly 3–5 reps in reserve. Once they are intermediate, they can skew higher-rep for size or lower-rep for strength.
- Rotate exercise selection every 8–12 weeks.

Rules: The logged data are estimates (portion sizes, photo-based calories), so calibrate confidence and say so. You are not a substitute for in-person medical care. If you notice red flags — pain/injury patterns, signs of disordered eating, or rapid unexplained weight change — respond supportively and recommend they consult a qualified professional rather than pushing numeric targets. This overrides the programming standards above: do not prescribe a deficit, a rate of loss, or any other number into that situation. Be direct and avoid filler. Keep the whole response concise and readable on a phone — aim for roughly 450–650 words, and always finish every section rather than cutting off.`;

function linRateWk(pts){
  if(pts.length < 2) return null;
  const r0 = pd(pts[0].date).getTime();
  const xs = pts.map(w => (pd(w.date).getTime()-r0)/864e5), ys = pts.map(w => w.value);
  const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0),
        sxx=xs.reduce((a,b)=>a+b*b,0), sxy=xs.reduce((a,b,i)=>a+b*ys[i],0);
  const dd = n*sxx - sx*sx;
  return dd ? ((n*sxy - sx*sy)/dd)*7 : 0;
}
function weeklyRate(asc){
  if(asc.length < 2) return null;
  const latest = pd(asc[asc.length-1].date).getTime();
  const win = asc.filter(w => (latest - pd(w.date).getTime())/864e5 <= 28);
  return linRateWk(win.length >= 2 ? win : asc);
}

/* ---- analysis archive -------------------------------------------------- */
const COACH_KEEP     = 12;    // analyses retained in storage
const COACH_SEND     = 3;     // most recent analyses sent back to the model in full
const CLIP_ASSISTANT = 4000;  // chars of a past analysis to resend
const CLIP_USER      = 600;   // chars of a past follow-up to resend
const clip = (s, n) => { s = String(s||""); return s.length > n ? s.slice(0, n) + " …[truncated]" : s; };

// history array as it would stand if the current analysis were archived right now
function coachArchive(){
  const c = D.coach;
  const hist = (c.history || []).slice();
  if(c.current && (c.current.messages||[]).some(m => m.role==="assistant" && (m.content||"").trim())){
    hist.push({ date: c.current.date, messages: c.current.messages.slice(1) });  // drop the data blob
  }
  return hist.slice(-COACH_KEEP);
}

function pastAnalysesBlock(hist){
  if(!hist.length) return "";
  const L = ["\n=== YOUR PREVIOUS ANALYSES (oldest first) ==="];
  const older = hist.slice(0, Math.max(0, hist.length - COACH_SEND));
  if(older.length) L.push(`Earlier analyses were written on: ${older.map(a=>a.date).join(", ")} (full text omitted here).`);
  hist.slice(-COACH_SEND).forEach(a => {
    L.push(`\n--- Analysis of ${a.date} ---`);
    (a.messages||[]).forEach(m => {
      if(m.role === "assistant") L.push("YOU WROTE: " + clip(m.content, CLIP_ASSISTANT));
      else                       L.push("USER ASKED: " + clip(m.content, CLIP_USER));
    });
  });
  return L.join("\n");
}

function buildCoachContext(hist){
  const c = D.coach, L = [];
  const today0 = pd(today()).getTime();
  hist = hist || [];

  L.push("=== INSTRUCTIONS ===");
  L.push(hist.length
    ? `Your previous analyses are reproduced below; the most recent was ${hist[hist.length-1].date} (${ago(hist[hist.length-1].date)} days ago). Judge what has changed since then: which of your recommendations were followed, which were not, and what the data show as a result. Do not repeat that advice verbatim — revise it. Use the full history for long-term trends.`
    : `This is the first analysis. Assess the full history below.`);

  const past = pastAnalysesBlock(hist);
  if(past) L.push(past);

  L.push("\n=== GOALS ===");
  L.push(c.goals && c.goals.trim() ? c.goals.trim() : "(none written)");

  const asc = [...D.weights].sort((a,b)=>a.date.localeCompare(b.date));
  L.push("\n=== BODYWEIGHT (full history) ===");
  if(asc.length){
    L.push(`${asc.length} weigh-ins, ${asc[0].date} (${asc[0].value} lb) → ${asc[asc.length-1].date} (${asc[asc.length-1].value} lb).`);
    const rAll = linRateWk(asc), r4 = weeklyRate(asc);
    if(rAll!=null) L.push(`Overall rate: ${rAll.toFixed(2)} lb/week. Recent 4-week rate: ${r4.toFixed(2)} lb/week.`);
    const show = asc.length > 40 ? asc.slice(-40) : asc;
    L.push(`${asc.length>40?"Last 40 ":"All "}weigh-ins: ${show.map(w=>w.date+":"+w.value).join(", ")}`);
  } else L.push("None logged.");

  L.push("\n=== CURRENT PHASE ===");
  if(D.phase){
    const ph = D.phase, def = PHASES[ph.type], pr = phaseProgress(ph);
    L.push(`${def.label}, started ${ph.start} at ${ph.startWeight} lb — week ${Math.floor(pr.weeks)+1} of an intended ${def.weeks[0]}-${def.weeks[1]}.`);
    L.push(`Target band ${pr.loLb.toFixed(2)}-${pr.hiLb.toFixed(2)} lb/week${ph.level?` (${GAIN_LEVELS[ph.level].label})`:""}. Observed ${pr.perWeek!=null?pr.perWeek.toFixed(2)+" lb/week":"not enough weigh-ins"}${pr.changed!=null?`, ${pr.changed>0?"+":""}${pr.changed.toFixed(1)} lb overall (${pr.pctChanged.toFixed(1)}% of start)`:""}.`);
    const warn = phaseWarnings(ph, pr);
    if(warn.length) L.push("Flags: " + warn.join(" "));
  } else L.push("No phase running. If the data suggest one, say which and why.");
  if(D.phases.length)
    L.push("Previous phases: " + D.phases.map(x=>`${(PHASES[x.type]||{label:x.type}).label} ${x.start}→${x.end}${x.endWeight!=null?` (${x.startWeight}→${x.endWeight} lb)`:""}`).join("; "));

  L.push("\n=== MEASURED MAINTENANCE ===");
  const td = tdeeEstimate();
  if(td){
    L.push(`${Math.round(td.tdee)} cal/day +/- ${Math.round(td.se)}, from ${td.days} days: mean intake ${Math.round(td.intake)} cal/day over ${td.loggedDays} logged days, weight trend ${td.perWeek.toFixed(2)} lb/week across ${td.weighIns} weigh-ins, at ${td.k} cal/lb.`);
    L.push(td.confident
      ? "The interval is tight enough to base calorie targets on. Prefer it over any formula estimate."
      : "The interval is too wide to act on. Treat it as a hint, base recommendations on observed rate of change instead, and say the estimate needs more data.");
    L.push("This inverts logged intake, so a consistent under-report shifts it by the same amount it shifts the log; a deficit set against it still lands about right. It breaks only if the logging habit itself changes.");
  } else L.push("Not enough overlapping weight and food data to measure it yet.");

  const t = NUT().targets;
  L.push("\n=== NUTRITION TARGETS ===");
  L.push(`Calories ${t.calMin}-${t.calMax} | Protein ${t.pMin}-${t.pMax}g | Carbs ${t.cMin}-${t.cMax}g (of which fiber ${t.fbMin}-${t.fbMax}g) | Fat ${t.fMin}-${t.fMax}g`);

  const logDates = Object.keys(NUT().log).filter(d=>dayEntries(d).length).sort();
  L.push("\n=== NUTRITION ADHERENCE ===");
  if(logDates.length){
    const avg = dates => {
      const s = dates.reduce((a,ds)=>{const x=dayTotals(ds);return{cal:a.cal+x.cal,p:a.p+x.protein,c:a.c+x.carb,fb:a.fb+x.fiber,f:a.f+x.fat};},{cal:0,p:0,c:0,fb:0,f:0});
      const n = dates.length;
      return `${round(s.cal/n)} cal, ${round(s.p/n)}g P, ${round(s.c/n)}g C (incl. ${round(s.fb/n)}g fiber), ${round(s.f/n)}g F (${n} days)`;
    };
    L.push(`Full-period avg/day: ${avg(logDates)}. Range ${logDates[0]}–${logDates[logDates.length-1]}.`);
    const recent = logDates.filter(ds => (today0 - pd(ds).getTime())/864e5 <= 14);
    if(recent.length) L.push(`Last 14 days avg/day: ${avg(recent)}.`);
  } else L.push("No nutrition logged.");

  L.push("\n=== TRAINING ===");
  const sess = [...D.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  if(sess.length){
    L.push(`${sess.length} sessions, ${sess[0].date} → ${sess[sess.length-1].date}.`);
    const byEx = {};
    sess.forEach(s => (s.exercises||[]).forEach(e => { (byEx[e.name]=byEx[e.name]||[]).push({date:s.date, e}); }));
    L.push("Per-exercise progression (first → latest):");
    Object.keys(byEx).forEach(name=>{
      const arr = byEx[name], f = arr[0].e, l = arr[arr.length-1].e;
      const fmt = e => `${fmtNum(Math.round(meanOf(e.sets,"weight")*10)/10)}lb×${(e.sets||[]).length}×${fmtNum(Math.round(meanOf(e.sets,"reps")*10)/10)} vol ${round(exVolume(e))}`;
      L.push(`  ${name}: done ${arr.length}× | ${arr[0].date} ${fmt(f)} → ${arr[arr.length-1].date} ${fmt(l)}`);
    });
    const recent = sess.filter(s => (today0 - pd(s.date).getTime())/864e5 <= 14);
    L.push("Recent sessions (last 14 days):");
    if(recent.length) recent.forEach(s=>{
      if(s.workout==="C") L.push(`  ${s.date} Steps: ${dayDetail(s)}`);
      else L.push(`  ${s.date} ${wLabel(s.workout)}: ` + (s.exercises||[]).map(e=>`${e.name} vol ${round(exVolume(e))}`).join("; "));
    }); else L.push("  (none)");
    const a7 = stepsAvg(7), a28 = stepsAvg(28);
    if(a7)  L.push(`Steps: 7-day average ${a7.avg} across ${a7.days} logged day(s).`);
    if(a28) L.push(`Steps: 28-day average ${a28.avg} across ${a28.days} logged day(s). Days with no entry are not counted, so treat coverage as partial.`);
  } else L.push("No training logged.");

  return L.join("\n");
}

async function callCoach(messages, maxTokens){

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": aiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({ model: AI_MODEL, max_tokens: maxTokens||1400, system: COACH_SYSTEM, messages })
  });
  if(!res.ok){
    let msg = "HTTP " + res.status;
    try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(_){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!text){
    const reason = data.stop_reason || "unknown";
    const types = (data.content||[]).map(b=>b.type).join(",") || "none";
    if(reason === "refusal"){
      throw new Error("the model declined this request. Try wording your goals more neutrally, or switch models in ⚙.");
    }
    throw new Error("no text came back (stop_reason: " + reason + ", blocks: " + types + ")");
  }
  return text;
}

function saveGoals(v){ D.coach.goals = v; save(); }

/* Two-week lock: days still to wait before a new analysis is allowed (0 = ready) */
const COACH_INTERVAL = 14;
function lockDaysLeft(){
  const lr = D.coach.lastRun;
  if(!lr) return 0;
  return Math.max(0, COACH_INTERVAL - ago(lr));
}

async function runAnalysis(force){
  if(!aiKey){ coachMsg = "Set your API key on the Diet → Foods tab (⚙) first."; render(); return; }
  if(!force && lockDaysLeft() > 0){ coachMsg = `Next analysis unlocks in ${lockDaysLeft()} day(s).`; render(); return; }
  const hist = coachArchive();     // includes the analysis currently on screen
  coachBusy = true; coachMsg = "Analyzing your history with " + AI_LABEL + "…"; render();
  try{
    const messages = [{ role:"user", content: buildCoachContext(hist) + "\n\nAs my coach, give me a full progress analysis and evidence-based, sustainable recommendations for a healthy adult pursuing general fitness and body-composition goals." }];
    const reply = await callCoach(messages, 25000);
    if(!reply || !reply.trim()) throw new Error("the model returned an empty response");
    messages.push({ role:"assistant", content: reply });
    D.coach.history = hist;        // only commit the archive once the new one succeeded
    D.coach.current = { date: today(), messages };
    D.coach.lastRun = today();
    coachBusy = false; coachMsg = "";
    save(); render();
  }catch(ex){
    coachBusy = false; coachMsg = "Analysis failed: " + (ex.message || "try again") + " (check your key and connection).";
    render();
  }
}

function followupsUsed(){
  return D.coach.current ? D.coach.current.messages.filter((m,i)=> i>0 && m.role==="user").length : 0;
}

async function sendFollowup(){
  if(!D.coach.current) return;
  if(followupsUsed() >= 5){ coachMsg = "You've used all 5 follow-ups for this analysis."; render(); return; }
  const text = (document.getElementById("followupInput").value || "").trim();
  if(!text){ return; }
  coachBusy = true; coachMsg = "Thinking…"; render();
  D.coach.current.messages.push({ role:"user", content: text });
  try{
    const reply = await callCoach(D.coach.current.messages, 25000);
    if(!reply || !reply.trim()) throw new Error("the model returned an empty response");
    D.coach.current.messages.push({ role:"assistant", content: reply });
    coachBusy = false; coachMsg = "";
    save(); render();
  }catch(ex){
    D.coach.current.messages.pop();   // undo optimistic push so they can retry
    coachBusy = false; coachMsg = "Follow-up failed: " + (ex.message || "try again");
    render();
  }
}

// tiny, safe markdown → HTML (escape first, then limited formatting)
function mdToHtml(s){
  let t = esc(s);
  t = t.replace(/^\s*#{1,4}\s*(.+)$/gm, '<b>$1</b>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  t = t.replace(/^\s*[-*•]\s+(.+)$/gm, '• $1');
  t = t.replace(/\n/g, '<br>');
  return t;
}

  } else {
    h += `<button class="primary" ${coachBusy?"disabled":""} onclick="runAnalysis()">${coachBusy?"Working…":(hasAnalysis?"Run a new analysis":"Get AI analysis")}</button>
      <p class="sub" style="margin-top:8px">Evidence-based estimate from a PT / dietitian / coach persona — not medical advice. Uses your full history${(c.history||[]).length?" and your previous "+(c.history||[]).length+" analys"+((c.history||[]).length===1?"is":"es"):""}.</p>`;
  }
  if(coachMsg) h += `<p class="sub" style="margin-top:8px;color:${coachMsg.includes("failed")?"var(--bad)":"var(--dim)"}">${esc(coachMsg)}</p>`;
  h += `</div>`;

  if(hasAnalysis){
    h += `<div class="eyebrow" style="color:var(--dimmer);margin:6px 2px">Analysis · ${shortD(c.current.date)}</div>`;
    c.current.messages.forEach((m,i)=>{
      if(i===0) return;                          // hide the compiled data context
      const isUser = m.role === "user";
      h += `<div class="coachmsg ${isUser?"cu":"ca"}">${isUser ? esc(m.content) : mdToHtml(m.content)}</div>`;
    });
    const used = followupsUsed();
    if(used < 5){
      h += `<div class="card">
        <textarea id="followupInput" class="ta" rows="2" placeholder="Ask a follow-up…"></textarea>
        <button class="primary" style="margin-top:8px" ${coachBusy?"disabled":""} onclick="sendFollowup()">Send · ${used}/5 used</button>
      </div>`;
    } else {
      h += `<p class="sub" style="text-align:center;margin-top:12px">All 5 follow-ups used for this analysis. A new analysis resets them.</p>`;
    }
  }

  const hist = c.history || [];
  if(hist.length){
    h += `<div class="eyebrow" style="color:var(--dimmer);margin:18px 2px 6px">Earlier analyses (kept as coach memory)</div>`;
    hist.slice().reverse().forEach((a, k) => {
      const i = hist.length - 1 - k;
      const open = !!openPast[i];
      h += `<div class="card" style="margin-bottom:8px">
        <div onclick="togglePast(${i})" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
          <span><span class="caret" style="margin-right:6px;display:inline-block">${open?"▾":"▸"}</span>${shortD(a.date)}</span>
          <span class="sub">${(a.messages||[]).filter(m=>m.role==="user").length} follow-up(s)</span>
        </div>`;
      if(open) (a.messages||[]).forEach(m => {
        const isUser = m.role === "user";
        h += `<div class="coachmsg ${isUser?"cu":"ca"}" style="margin-top:10px">${isUser ? esc(m.content) : mdToHtml(m.content)}</div>`;
      });
      h += `</div>`;
    });
    h += `<p class="sub" style="text-align:center;margin-top:6px">The last ${COACH_SEND} are sent back to the coach in full; older ones by date only. Last ${COACH_KEEP} kept.</p>`;
  }
  return h;
}

function addEntry(meal, foodId){
  const food = foodById(foodId);
  if(!food) return;
  const base = food.refUnit || "g";
  const entry = { id:uid("e"), foodId, name:food.name, meal, qty:(food.amount||100), unit:base, per:perBase(food) };
  if(!NUT().log[dietDate]) NUT().log[dietDate] = [];
  NUT().log[dietDate].push(entry);
  invalidateLogStats(); save(); render();
}
function findEntry(id){
  const list = NUT().log[dietDate] || [];
  return list.find(e=>e.id===id);
}

// shared hint HTML for a train exercise: last-session summary, colored volume vs this session
function meanOf(sets, field){
  const nums = (sets||[]).map(s => parseFloat(s[field]) || 0);
  return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : 0;
}
const fmtNum = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
function rowHintInner(d, prev){
  if(!prev) return "first time";
  const lastVol = exVolume(prev);
  const curVol = exVolume(d);
  const mw = fmtNum(Math.round(meanOf(prev.sets,"weight")*10)/10);   // mean weight (1 dp)
  const mr = fmtNum(Math.round(meanOf(prev.sets,"reps")*10)/10);      // mean reps (1 dp)
  let s = `last: ${mw} lb · ${(prev.sets||[]).length}×${mr} · vol ${round(lastVol)}`;
  if(curVol > 0){
    const cls = curVol > lastVol ? "up" : (curVol < lastVol ? "down" : "");
    const arw = curVol > lastVol ? "▲" : (curVol < lastVol ? "▼" : "•");
    s += ` <span class="${cls}">→ ${round(curVol)} ${arw}</span>`;
  }
  return s;
}
