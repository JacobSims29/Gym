<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0a0a0a">
<title>Gym Log</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a; --card:#171717; --line:#262626; --line2:#404040;
    --text:#f5f5f5; --dim:#a3a3a3; --dimmer:#525252;
    --accent:#fbbf24; --good:#34d399; --bad:#f87171; --steps:#60a5fa;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:calc(120px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;padding:16px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h2{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
  .sub{font-size:13px;color:var(--dimmer);margin-top:4px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:8px}
  .grow{flex:1}

  input{
    background:var(--bg);border:1px solid var(--line2);border-radius:6px;
    color:var(--text);padding:12px;font-size:16px;font-family:inherit;width:100%;
  }
  input:focus{outline:none;border-color:var(--accent)}
  .ta{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--text);
    padding:10px;font-size:16px;font-family:inherit;resize:vertical}
  .ta:focus{outline:none;border-color:var(--accent)}
  .coachmsg{border-radius:10px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
  .coachmsg.ca{background:var(--card);border:1px solid var(--line)}
  .coachmsg.cu{background:#1e293b;color:#dbeafe;margin-left:24px}
  input.num{font-family:ui-monospace,Menlo,monospace;text-align:center;font-variant-numeric:tabular-nums}
  input.sr{width:52px;padding:12px 4px;color:var(--dim);border-color:var(--line)}

  button{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:8px;
    padding:14px;cursor:pointer;background:var(--card);color:var(--text);width:100%}
  .primary{background:var(--accent);color:#0a0a0a}
  .ghost{background:#262626;color:var(--text)}
  .saved{background:#059669;color:#fff}
  .icon{width:auto;padding:8px;background:none;color:var(--dimmer);font-size:16px}

  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
  .seg button{border:1px solid var(--line);background:var(--card);color:var(--dimmer);padding:12px 4px;font-size:14px}
  .seg button.on{border-color:var(--accent);background:#262626;color:var(--text)}
  .seg button.on.steps{border-color:var(--steps)}

  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:30}
  .nav button{background:none;border-radius:0;font-size:10px;font-weight:600;color:var(--dimmer);
    padding:14px 0;border-top:2px solid transparent}
  .nav button.on{color:var(--accent);border-top-color:var(--accent)}

  /* diet */
  .subseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
  .subseg button{border:1px solid var(--line);background:var(--card);color:var(--dimmer);padding:10px 4px;font-size:13px}
  .subseg button.on{border-color:var(--accent);background:#262626;color:var(--text)}
  .toggle{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:14px}
  .toggle button{padding:8px 18px;font-size:13px;border-radius:6px;color:var(--dimmer);background:none}
  .toggle button.on{background:#262626;color:var(--accent)}
  .kcal{font-size:40px;font-weight:700;letter-spacing:-.02em}
  .kcal span{font-size:15px;font-weight:500;color:var(--dimmer)}
  .bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin:10px 0;position:relative}
  .bar>div{height:100%;border-radius:5px}
  .macro{margin-top:12px}
  .macro.sub{margin-top:6px;margin-left:14px;padding-left:10px;border-left:2px solid var(--line)}
  .macro.sub .top{font-size:12px;color:var(--dim)}
  .macro.sub .val{font-size:12px}
  .macro.sub .mbar{height:4px;border-radius:2px}
  .macro.sub .tick{opacity:.45}
  .macro .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .macro .val{font-size:13px}
  .mbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;position:relative}
  .mbar>div{height:100%}
  .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(245,245,245,.6);border-radius:1px}
  .meal{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .meal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .meal .mh h3{font-size:17px;font-weight:600}
  .mtoggle{cursor:pointer;user-select:none;display:flex;align-items:center;flex:1}
  .copyrow{padding:12px 16px;border-top:1px solid var(--line)}
  .pill{font-size:12px;font-family:ui-monospace,Menlo,monospace;background:#1e293b;color:#93c5fd;padding:3px 8px;border-radius:10px;margin-left:6px}
  .pill.p{background:#2e1065;color:#c4b5fd}
  .fitem{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
  .fitem .fn{font-size:15px}
  .fitem .fq{font-size:12px;color:var(--dimmer);margin-top:2px}
  .fitem .fm{text-align:right;font-size:13px}
  .plus{width:auto;padding:6px 10px;background:none;color:var(--accent);font-size:20px}
  .addbox{padding:0 16px 14px}
  .pickrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .pickrow button.padd{width:auto;padding:6px 12px;background:#262626;color:var(--text);font-size:13px}
  .qty{display:flex;gap:6px;align-items:center;margin-top:6px}
  .qty input{width:70px;padding:8px;text-align:center}
  .qty select{width:auto;padding:8px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--text);font-size:14px}
  .foodcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
  .foodcard .macros{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
  .foodcard .macros label{font-size:10px;color:var(--dimmer);display:block;text-align:center;margin-bottom:2px}
  .foodcard .macros input{padding:8px 2px;text-align:center;font-size:13px}

  .lift{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .lift h3{font-size:16px;font-weight:600}
  .exname{font-size:16px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:6px;
    color:var(--text);padding:8px 10px;width:100%}
  .exname:focus{outline:none;border-color:var(--accent)}
  .exhead{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .exname-d{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .setshead{display:grid;grid-template-columns:38px 1fr 1fr 40px;gap:8px;align-items:center;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);margin-bottom:6px}
  .setshead span{text-align:center}
  .setshead span:first-child{text-align:left}
  .setrow{display:grid;grid-template-columns:38px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
  .setnum{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--dim);text-align:center;
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 0}
  .planrow{padding:12px 0;border-bottom:1px solid var(--line)}
  .planrow:last-child{border-bottom:none}
  .down{color:var(--bad)}
  button.icon:disabled{opacity:.25}
  .last{font-size:11px;color:var(--dimmer);font-family:ui-monospace,Menlo,monospace}
  .up{color:var(--good)}

  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .hdr .mid{text-align:center;cursor:pointer}
  .arrow{background:none;color:var(--dimmer);font-size:22px;width:44px;padding:8px}
  .caret{font-size:11px;color:var(--dimmer);margin-top:2px}

  /* calendar */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .calhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .calhdr span{font-size:14px;font-weight:600}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:6px;font-size:13px;color:var(--dim);background:none;padding:0;font-weight:500}
  .cd.dow{color:var(--dimmer);font-size:10px;font-weight:600;text-transform:uppercase;aspect-ratio:auto;padding:4px 0}
  .cd.blank{visibility:hidden}
  .cd.today{border:1px solid var(--line2)}
  .cd.sel{background:var(--accent);color:#0a0a0a;font-weight:700}
  .dots{display:flex;gap:2px;height:4px;margin-top:2px}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .dot.c{background:var(--steps)}
  .cd.sel .dot{background:#0a0a0a}

  .list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;
    border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:none}
  .tap{flex:1;text-align:left;background:none;padding:0;font-weight:400;font-size:14px;color:var(--dim)}

  .empty{border:1px dashed var(--line2);border-radius:10px;padding:32px 16px;text-align:center;color:var(--dimmer);font-size:14px}
  .warn{background:#422006;border:1px solid #78350f;color:#fcd34d;padding:12px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .ok{color:var(--good);font-size:13px;margin-top:8px}
  .err{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;padding:12px;border-radius:8px;font-size:13px;margin-bottom:12px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .photo{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo.picked{border:2px solid var(--accent)}
  .photo .del{position:absolute;top:6px;right:6px;background:rgba(10,10,10,.8);color:var(--dim);
    width:auto;padding:4px 8px;border-radius:6px;font-size:14px}
  .photo .badge{position:absolute;top:6px;left:6px;background:var(--accent);color:#0a0a0a;
    width:22px;height:22px;border-radius:50%;font-size:12px;padding:0;display:flex;align-items:center;justify-content:center}
  .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--dimmer);margin-top:4px}

  .fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;
    border-radius:50%;background:#262626;border:1px solid var(--line2);color:var(--accent);
    font-size:22px;padding:0;z-index:31;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  .timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:31;padding:0 16px}
  .timer .card{margin:0 auto;max-width:480px;box-shadow:0 4px 24px rgba(0,0,0,.6)}
  .clock{font-size:40px;font-weight:600;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .clock.done{color:var(--good)}
  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .presets button{padding:10px 0;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--dimmer);
    font-family:ui-monospace,Menlo,monospace}
  .presets button.on{background:#404040;color:var(--text)}
  .tbtn{width:48px;height:48px;padding:0;font-size:18px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
  .stats .n{font-size:26px;font-family:ui-monospace,Menlo,monospace}
  .stats .l{font-size:11px;color:var(--dimmer)}
  .hide{display:none!important}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<button class="fab" id="fab" onclick="TIMER.open()">⏱</button>
<div class="timer" id="timer" style="display:none">
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="eyebrow" style="color:var(--dimmer)">Rest</span>
      <button class="icon" onclick="TIMER.close()">✕</button>
    </div>
    <div class="row">
      <div class="clock" id="clock">1:30</div>
      <div class="row" style="margin-left:auto">
        <button class="primary tbtn" id="playBtn" onclick="TIMER.toggle()">▶</button>
        <button class="ghost tbtn" onclick="TIMER.reset()">↺</button>
      </div>
    </div>
    <div class="presets" id="presets"></div>
  </div>
</div>

<nav class="nav" id="nav"></nav>

<script>
/* ============ constants ============ */
const KEY = "gymlog.v1";
// Date.now() alone collides when two records are created in the same millisecond —
// two phases, two foods, two entries — so a counter is appended.
let idSeq = 0;
const uid = prefix => prefix + Date.now().toString(36) + (idSeq++).toString(36);
const AI_KEY_LS = "gymlog.ai.key";      // stored separately so it never lands in a backup
/* ---- cloud backup ----
   The access code names which backup in the cloud is yours. Like the AI key it lives
   in its own localStorage key and never lands in an export: an export is a file you
   might hand to someone, and this is a credential. Write it down somewhere outside
   the app — if the phone is what you lost, a code stored only on the phone is no use. */
const SYNC_CODE_LS  = "gymlog.sync.code";
const SYNC_STATE_LS = "gymlog.sync.state";
const SYNC_URL      = "/api/backup";    // same origin: the Worker serving this file also answers here
const SYNC_EVERY    = 3 * 60 * 1000;    // ms between automatic attempts while the app is open
let syncCode = "";
let syncState = { at:null, ok:null, msg:"" };
let syncDirty = false;                  // set by save(), cleared by a successful upload
let syncBusy = false;
let syncList = null;                    // dates fetched for the restore picker, null until asked
const AI_MODEL = "claude-sonnet-5";     // one model, no picker: the cheaper one guessed portions badly
const AI_LABEL = "Sonnet 5";
let aiKey = "";
const START = "2026-07-06";
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SCHEMA = 13;  // bump whenever the saved data shape changes, and add a migration below
const SCRATCH_KEY = "gymlog.scratch.v1";   // the hot path: rewritten while you type a set, kept out of the main blob
const LIB_STALE_KEY = "gymlog.lib.v1";     // retired in v13; removed on load to reclaim the space
const PRE_KEY = "gymlog.pre.v1";           // copy of the data as it stood before the last upgrade
const PRE_MAX = 800000;                    // chars — don't take a snapshot bigger than this
const SAVE_DEBOUNCE = 500;                 // ms — coalesce keystroke writes
const DEFAULT_TARGETS = { calMin:2000, calMax:2200, pMin:150, pMax:200, cMin:180, cMax:280, fMin:50, fMax:80, fbMin:25, fbMax:40 };
const EMPTY = {
  schema:SCHEMA,
  templates:[{id:"A",name:"Workout A",exercises:[]},{id:"B",name:"Workout B",exercises:[]}],
  sessions:[], weights:[], photos:[], lastBackup:null,
  phase:null, phases:[], mealTemplates:[],
  scratch:{},
  coach:{ goals:"", lastRun:null, current:null, history:[] },
  nutrition:{ targets:{...DEFAULT_TARGETS}, foods:[], log:{}, hidden:[] }
};

let D = structuredClone(EMPTY);
let tab = "train", err = "", note = "";
// Set when saved data could not be read. While it is set, nothing is written: the
// alternative is an empty D quietly overwriting real history the first time the user
// taps anything.
let blocked = null;

/* ============ dates ============ */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => iso(new Date());
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dow = s => DAYS[pd(s).getDay()];
const wk = s => Math.floor((pd(s)-pd(START))/864e5/7)+1;
const shortD = s => pd(s).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const ago = s => Math.floor((pd(today())-pd(s))/864e5);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ migrations ============
   Each entry upgrades data from version N to N+1. They run in order, so a v1
   backup opened by a v5 app walks 1→2→3→4→5. Never edit an old migration once
   it has shipped; add a new one and bump SCHEMA.                              */
const MIGRATIONS = {
  // 1 → 2: one plan became two (A/B); sessions gained a workout tag; cardio arrived
  1(d){
    if(d.plan && !d.plans){ d.plans = { A:d.plan, B:[] }; delete d.plan; }
    if(!d.plans) d.plans = { A:[], B:[] };
    d.plans.A = d.plans.A || [];
    d.plans.B = d.plans.B || [];
    (d.sessions || []).forEach(s => { if(!s.workout) s.workout = "A"; });
    return d;
  },
  // 2 → 3: workout names became editable
  2(d){
    if(!d.names) d.names = { A:"Workout A", B:"Workout B" };
    return d;
  },
  // 3 → 4: fixed A/B plans became an open list of templates
  3(d){
    if(d.plans){                       // genuine pre-v4 data: rebuild from the old shape
      const names = d.names || {};
      const plans = d.plans;
      d.templates = ["A","B"].map(k => ({
        id: k,
        name: names[k] || ("Workout " + k),
        exercises: plans[k] || []
      }));
    } else if(!d.templates){           // safety net: nothing to convert, no templates yet
      d.templates = [
        { id:"A", name:"Workout A", exercises:[] },
        { id:"B", name:"Workout B", exercises:[] }
      ];
    }
    delete d.plans;
    delete d.names;
    return d;
  },
  // 4 → 5: nutrition tracker added
  4(d){
    if(!d.nutrition) d.nutrition = { targets:{ calMin:2000, calMax:2200, pMin:150, pMax:200, cMin:180, cMax:280, fMin:50, fMax:80 }, foods:[], log:{} };
    if(!d.nutrition.targets) d.nutrition.targets = { calMin:2000, calMax:2200, pMin:150, pMax:200, cMin:180, cMax:280, fMin:50, fMax:80 };
    if(!d.nutrition.foods) d.nutrition.foods = [];
    if(!d.nutrition.log) d.nutrition.log = {};
    return d;
  },
  // 5 → 6: foods can be defined by mass (g) or volume (ml); portions convert within the matching system
  5(d){
    const n = d.nutrition;
    if(n){
      (n.foods||[]).forEach(f => {
        if(f.amount === undefined){ f.amount = (f.grams !== undefined ? f.grams : 100); f.refUnit = "g"; delete f.grams; }
      });
      Object.values(n.log||{}).forEach(list => (list||[]).forEach(e => { if(!e.base) e.base = "g"; }));
    }
    return d;
  },
  // 6 → 7: (steps feature removed; kept as a no-op so v6 data still upgrades)
  6(d){
    return d;
  },
  // 7 → 8: each logged exercise becomes a list of individual sets; add scratch store for unsaved entries
  7(d){
    (d.sessions||[]).forEach(s => {
      if(s.exercises){
        s.exercises = s.exercises.map(e => {
          if(Array.isArray(e.sets)) return e;                    // already new shape
          const cnt = parseInt(e.sets, 10) || 1;
          const one = { weight: e.weight!==undefined ? String(e.weight) : "", reps: e.reps!==undefined ? String(e.reps) : "" };
          return { name: e.name, sets: Array.from({length:cnt}, () => ({...one})) };
        });
      }
    });
    if(!d.scratch) d.scratch = {};
    return d;
  },
  // 8 → 9: AI coach (goals, biweekly analysis, follow-ups)
  8(d){
    if(!d.coach) d.coach = { goals:"", lastRun:null, current:null };
    return d;
  },
  // 9 → 10: coach keeps an archive of past analyses so it can reference them later
  9(d){
    if(!d.coach) d.coach = { goals:"", lastRun:null, current:null };
    if(!Array.isArray(d.coach.history)) d.coach.history = [];
    return d;
  },
  // 10 → 11: fiber tracked as a component of carbs — target range, per-food value,
  // and a `fiber` rate backfilled onto every already-logged entry
  10(d){
    const n = d.nutrition;
    if(!n) return d;
    if(n.targets){
      if(n.targets.fbMin == null) n.targets.fbMin = 25;
      if(n.targets.fbMax == null) n.targets.fbMax = 40;
    }
    (n.foods||[]).forEach(f => { if(f.fiber == null) f.fiber = 0; });
    Object.keys(n.log||{}).forEach(ds => {
      (n.log[ds]||[]).forEach(e => {
        if(!e.per) return;
        if(e.per.fiber == null){
          // recover the rate from the source food if it still exists, else 0
          const f = (n.foods||[]).find(x => x.id === e.foodId);
          const a = f ? (parseFloat(f.amount)||1) : 1;
          e.per.fiber = f ? (parseFloat(f.fiber)||0)/a : 0;
        }
      });
    });
    return d;
  },
  // 11 -> 12: the starter library moved out of saved data. `foods` now holds only what
  // you created or edited; the shipped library is fetched into memory at startup and
  // merged in for display. `hidden` records library foods you deleted so they stay gone.
  // Log entries also shed `base` (recoverable from `unit`) and store their `per` rates as
  // a fixed-order [cal, protein, carb, fiber, fat] array rounded to six significant
  // figures — the same numbers to 1 part in 10^6, about a third fewer bytes per entry.
  // Nothing is removed from `foods` here: that needs the library, which loads later, so
  // reconcileSeeds() does it once the file lands.
  11(d){
    const n = d.nutrition;
    if(!n) return d;
    if(!Array.isArray(n.hidden)) n.hidden = [];
    Object.keys(n.log||{}).forEach(ds => {
      (n.log[ds]||[]).forEach(e => {
        if(e.per && !Array.isArray(e.per)) e.per = toPer(e.per);
        if(e.base && e.unit && baseOf(e.unit) === e.base) delete e.base;
      });
    });
    return d;
  },
  // 12 -> 13: a training phase you are currently in, an archive of finished ones, and
  // saved meal templates. All three start empty; nothing existing is touched.
  12(d){
    if(!("phase" in d)) d.phase = null;
    if(!Array.isArray(d.phases)) d.phases = [];
    if(!Array.isArray(d.mealTemplates)) d.mealTemplates = [];
    return d;
  }
};

class NewerData extends Error {}

function migrate(raw){
  let v = Number(raw && raw.schema) || 1;
  if(v > SCHEMA) throw new NewerData(String(v));
  let d = Object.assign(structuredClone(EMPTY), raw || {});
  while(v < SCHEMA){
    const step = MIGRATIONS[v];
    if(!step) throw new Error("No migration from v" + v);
    d = step(d);
    v++;
  }
  d.schema = SCHEMA;
  if(d.nutrition && !Array.isArray(d.nutrition.hidden)) d.nutrition.hidden = [];
  if(!Array.isArray(d.phases)) d.phases = [];
  if(!Array.isArray(d.mealTemplates)) d.mealTemplates = [];
  return d;
}

/* ============ storage ============
   D is serialised whole on every save, so anything that grows without bound has to
   live outside it. Two things did: the in-progress set entry, which is rewritten on
   every keystroke, and the food library, which is 500 rows today and could be 50,000.
   Both now have their own keys. What is left in D is written at most once per
   SAVE_DEBOUNCE ms and is dominated by the diet log, which grows a few KB a day.  */
let scratchTimer = null;

function save(){
  if(blocked) return;                       // never write over data we failed to read
  try{ D.schema = SCHEMA; localStorage.setItem(KEY, JSON.stringify(D)); err=""; syncDirty = true; }
  catch(e){ err="Storage is full — export a backup to be safe."; }
}
// the unsaved-entry store, ~1 KB, written on its own instead of dragging all of D along
function saveScratch(){
  if(scratchTimer){ clearTimeout(scratchTimer); scratchTimer = null; }
  if(blocked) return;
  try{ localStorage.setItem(SCRATCH_KEY, JSON.stringify(D.scratch||{})); }catch(e){}
}
function saveScratchSoon(){
  if(scratchTimer) return;                                     // trailing edge: one write per burst
  scratchTimer = setTimeout(()=>{ scratchTimer = null; saveScratch(); }, SAVE_DEBOUNCE);
}
// iOS suspends a backgrounded web app without warning, so commit anything pending
function flushPending(){ if(scratchTimer) saveScratch(); }

// Migrations only run forwards, so the moment an upgrade lands the old build can no
// longer read the data. Keeping the last pre-upgrade copy makes a rollback survivable
// without anyone having remembered to export first.
function snapshotBefore(raw, from){
  if(raw.length > PRE_MAX) return;
  try{
    localStorage.setItem(PRE_KEY, JSON.stringify({ at: today(), from, to: SCHEMA, data: raw }));
  }catch(e){}                                // a full disk is not a reason to block the upgrade
}

function preSnapshot(){
  try{
    const s = localStorage.getItem(PRE_KEY);
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}

function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const from = Number(parsed && parsed.schema) || 1;
      if(from < SCHEMA) snapshotBefore(raw, from);
      D = migrate(parsed);
    }
    // a backup still carries scratch inside D; the standalone key is the fresher copy
    try{
      const sc = localStorage.getItem(SCRATCH_KEY);
      if(sc){ const o = JSON.parse(sc); if(o && typeof o === "object") D.scratch = o; }
    }catch(e){}
    if(raw) save();               // write the upgraded shape back
  }catch(e){
    blocked = { kind: e instanceof NewerData ? "newer" : "damaged",
                version: e instanceof NewerData ? e.message : null, raw };
  }
}

/* Nearly every "this app is out of date" is a stale copy of index.html sitting in
   Safari's HTTP cache, not a real rollback — the home screen icon holds whatever URL
   was saved when it was added, so it can keep serving an old build for a while. Try a
   cache-busting reload once, automatically, before showing anyone the wall. The
   sessionStorage flag stops it looping if the old file is genuinely what is deployed. */
const RELOAD_FLAG = "gymlog.reloaded";

function reloadFresh(){
  try{ sessionStorage.setItem(RELOAD_FLAG, "1"); }catch(e){}
  location.replace(location.pathname + "?v=" + Date.now());
}

function selfHealStaleBuild(){
  if(!blocked || blocked.kind !== "newer") return false;
  let tried = false;
  try{ tried = sessionStorage.getItem(RELOAD_FLAG) === "1"; }catch(e){}
  if(tried) return false;
  reloadFresh();
  return true;
}

// dump whatever is in storage to a file, readable or not
function downloadRaw(){
  try{
    const text = (blocked && blocked.raw) || localStorage.getItem(KEY) || "";
    const blob = new Blob([text], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `gym-raw-${today()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    note = "Saved. In the share sheet choose Save to Files.";
  }catch(e){ err = "Couldn't save the file."; }
  render();
}

function restorePreSnapshot(){
  const snap = preSnapshot();
  if(!snap || !snap.data) return;
  if(!confirm(`Roll back to the copy taken on ${snap.at}, before the upgrade from v${snap.from} to v${snap.to}? Anything logged since then is lost.`)) return;
  try{
    const parsed = JSON.parse(snap.data);
    blocked = null;                      // the snapshot is readable by definition of how it was taken
    D = migrate(parsed);
    save(); saveScratch(); invalidateFoods(); invalidateLogStats(); ensureSelection(); seedDraft();
    note = `Rolled back to the ${snap.at} copy.`;
  }catch(e){ err = "That snapshot could not be read."; }
  render();
}

/* ============ rest timer ============ */
const TIMER = {
  dur:60, left:60, running:false, endTime:0, tick:null, ctx:null, wake:null, panelOpen:false, alarmed:false,
  // show the button/panel only on the Train tab, respecting whether the panel is open
  sync(){
    const onTrain = (typeof tab !== "undefined") && tab === "train";
    const fab = document.getElementById("fab");
    const panel = document.getElementById("timer");
    if(fab) fab.style.display = (onTrain && !this.panelOpen) ? "" : "none";
    if(panel) panel.style.display = (onTrain && this.panelOpen) ? "" : "none";
  },
  open(){ this.panelOpen = true; this.sync(); this.draw(); },
  close(){ this.panelOpen = false; this.sync(); },
  pick(s){ this.dur = s; this.left = s; this.stopSilently(); this.draw(); },
  toggle(){ this.running ? this.stopSilently() : this.start(); },
  ensureCtx(){
    if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) this.ctx = new AC(); }
    if(this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  start(){
    this.ensureCtx();
    if(this.left <= 0) this.left = this.dur;
    this.endTime = Date.now() + this.left*1000;
    this.running = true; this.alarmed = false;
    this.requestWake();
    clearInterval(this.tick);
    this.tick = setInterval(()=>this.onTick(), 250);
    this.draw();
  },
  onTick(){
    if(!this.running) return;
    const rem = Math.max(0, Math.round((this.endTime - Date.now())/1000));
    this.left = rem;
    if(rem <= 0) this.finish();
    this.draw();
  },
  finish(){
    this.running = false; clearInterval(this.tick); this.releaseWake();
    if(!this.alarmed){ this.alarmed = true; this.alarm(); }
    this.draw();
  },
  stopSilently(){ this.running = false; clearInterval(this.tick); this.releaseWake(); this.draw(); },
  reset(){ this.left = this.dur; this.running = false; clearInterval(this.tick); this.releaseWake(); this.draw(); },
  // when the app returns to the foreground, recompute from the timestamp and re-grab the wake lock
  onVisible(){
    if(!this.running) return;
    const rem = Math.max(0, Math.round((this.endTime - Date.now())/1000));
    this.left = rem;
    if(rem <= 0){ this.finish(); } else { this.requestWake(); }
    this.draw();
  },
  requestWake(){
    try { if("wakeLock" in navigator){ navigator.wakeLock.request("screen").then(w=>{ this.wake = w; }).catch(()=>{}); } } catch(e){}
  },
  releaseWake(){
    try { if(this.wake){ this.wake.release(); this.wake = null; } } catch(e){}
  },
  alarm(){
    try{
      if(this.ctx){
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.connect(g); g.connect(this.ctx.destination);
        o.frequency.value=880;
        g.gain.setValueAtTime(.25,this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.7);
        o.start(); o.stop(this.ctx.currentTime+.7);
      }
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }catch(e){}
  },
  draw(){
    const c = document.getElementById("clock");
    if(!c) return;
    c.textContent = `${Math.floor(this.left/60)}:${String(this.left%60).padStart(2,"0")}`;
    c.className = "clock" + (this.left===0 ? " done" : "");
    document.getElementById("playBtn").textContent = this.running ? "❚❚" : "▶";
    document.getElementById("presets").innerHTML = [45,60,90,120].map(s=>
      `<button class="${s===this.dur?"on":""}" onclick="TIMER.pick(${s})">${s}s</button>`).join("");
  }
};
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") TIMER.onVisible(); });

/* ============ train state ============ */
let trainDate = today();
let trainWorkout = "A";          // a template id, or "C" for the Steps slot
let planWhich = "A";             // template id being edited on the Plan tab
let draft = [];                  // ordered rows for the day being edited
let openEx = {};                 // exercise _uid -> expanded in Train
let stepsDraft = "";             // the Steps slot reuses workout tag "C"
let justSaved = false;
let calOpen = false;
let calMonth = new Date();       // any date inside the shown month

const isSteps = w => w === "C";   // tag kept as "C" so pre-Steps sessions stay addressable
const tpl = id => D.templates.find(t => t.id === id);
const wLabel = w => w==="C" ? "Steps" : (tpl(w) ? tpl(w).name : "Workout");
const firstTemplateId = () => (D.templates[0] && D.templates[0].id) || "C";

// keep the two selections pointing at something that still exists
function ensureSelection(){
  if(!(trainWorkout === "C" || tpl(trainWorkout))) trainWorkout = firstTemplateId();
  if(!tpl(planWhich)) planWhich = (D.templates[0] && D.templates[0].id) || null;
}

function sessionOn(date, w){ return D.sessions.find(s=>s.date===date && s.workout===w); }

function lastLift(name){
  let found = null;
  [...D.sessions].sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(s => (s.exercises||[]).forEach(e => { if(e.name===name) found = e; }));
  return found;
}
function lastLiftBefore(name, date){
  let found = null;
  [...D.sessions].filter(s => s.date < date).sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(s => (s.exercises||[]).forEach(e => { if(e.name===name) found = e; }));
  return found;
}
// total volume of an exercise = sum over its sets of weight*reps
function exVolume(e){
  return (e.sets||[]).reduce((v,s)=> v + (parseFloat(s.weight)||0)*(parseFloat(s.reps)||0), 0);
}
// most recent day with a step count (skips pre-Steps cardio-only records)
function lastSteps(){
  const c = D.sessions.filter(s => s.workout==="C" && s.date!==trainDate && s.steps!=null && s.steps!=="")
                      .sort((a,b)=>a.date.localeCompare(b.date));
  return c.length ? c[c.length-1] : null;
}
// mean daily steps over the trailing n days, counting only days that were logged
function stepsAvg(n){
  const cut = pd(today()).getTime() - n*864e5;
  const v = D.sessions.filter(s => s.workout==="C" && pd(s.date).getTime() >= cut)
                      .map(s => parseFloat(s.steps)||0).filter(x => x > 0);
  return v.length ? { avg: Math.round(v.reduce((a,b)=>a+b,0)/v.length), days: v.length } : null;
}
// legacy minutes/miles from the old Cardio slot — still shown so nothing looks deleted
function dayDetail(s){
  const p = [];
  if(s.steps!=null && s.steps!=="") p.push(commas(Math.round(parseFloat(s.steps)||0)) + " steps");
  if(s.cardio && s.cardio.minutes) p.push(s.cardio.minutes+" min");
  if(s.cardio && s.cardio.miles) p.push(s.cardio.miles+" mi");
  return p.join(" · ") || "logged";
}
const commas = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

let uidCounter = 0;
const scratchKey = () => trainDate + "|" + trainWorkout;
function withUid(e){ return { _uid: ++uidCounter, name:e.name, sets:(e.sets||[]).map(s=>({weight:s.weight,reps:s.reps})) }; }

function seedDraft(){
  const ex = sessionOn(trainDate, trainWorkout);
  if(isSteps(trainWorkout)){
    stepsDraft = ex && ex.steps!=null ? String(ex.steps) : "";
    justSaved = false;
    return;
  }
  const sc = D.scratch && D.scratch[scratchKey()];
  if(sc){
    // unsaved in-progress entry takes precedence, so leaving the tab never loses work
    draft = sc.map(withUid);
  } else if(ex){
    // a logged day renders from its own saved snapshot
    draft = (ex.exercises||[]).map(withUid);
  } else {
    // no session yet: build from the template — one blank set per planned set
    const t = tpl(trainWorkout);
    draft = (t ? t.exercises : []).map(x => withUid({
      name: x.name,
      sets: Array.from({length: parseInt(x.sets,10)||1}, () => ({weight:"", reps:""}))
    }));
  }
  justSaved = false;
}

// Called on every keystroke in a set field. In-memory state updates immediately;
// the write is ~1 KB to its own key and debounced, instead of re-serialising all of D.
function writeScratch(){
  if(!D.scratch) D.scratch = {};
  D.scratch[scratchKey()] = draft.map(e => ({ name:e.name, sets:e.sets.map(s=>({weight:s.weight,reps:s.reps})) }));
  saveScratchSoon();
}

/* ============ calendar (shared) ============ */
function monthCalendar(sel, pickFn, dotsFn){
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const days = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
  let cells = "";
  DAYS.forEach(d => cells += `<div class="cd dow">${d[0]}</div>`);
  for(let i=0;i<first.getDay();i++) cells += `<div class="cd blank"></div>`;
  for(let d=1; d<=days; d++){
    const ds = iso(new Date(calMonth.getFullYear(), calMonth.getMonth(), d));
    const dots = dotsFn ? dotsFn(ds) : "";
    const cls = ["cd", ds===sel?"sel":"", ds===today()?"today":""].filter(Boolean).join(" ");
    cells += `<button class="${cls}" onclick="${pickFn}('${ds}')">${d}<span class="dots">${dots}</span></button>`;
  }
  return `<div class="cal">
    <div class="calhdr">
      <button class="arrow" onclick="shiftMonth(-1)">‹</button>
      <span>${MONTHS[calMonth.getMonth()]} ${calMonth.getFullYear()}</span>
      <button class="arrow" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="calgrid">${cells}</div>
    <button class="ghost" style="margin-top:10px;padding:10px;font-size:13px" onclick="${pickFn}('${today()}')">Jump to today</button>
  </div>`;
}
function trainDots(ds){
  return D.sessions.filter(s=>s.date===ds).map(s=>`<span class="dot ${s.workout==="C"?"c":""}"></span>`).join("");
}
function calendarHTML(){ return monthCalendar(trainDate, "pickDate", trainDots); }
function shiftMonth(n){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+n, 1); render(); }
function pickDate(ds){ trainDate = ds; calMonth = pd(ds); calOpen = false; seedDraft(); render(); }
function toggleCal(){ calOpen = !calOpen; if(calOpen) calMonth = pd(trainDate); render(); }

/* ============ train view ============ */
function viewTrain(){
  const existing = sessionOn(trainDate, trainWorkout);

  let h = `
  <div class="hdr">
    <button class="arrow" onclick="${calOpen?"shiftMonth(-1)":"shiftDay(-1)"}">‹</button>
    <div class="mid" onclick="toggleCal()">
      <div class="eyebrow">${calOpen ? `${MONTHS[calMonth.getMonth()]} ${calMonth.getFullYear()}` : `Week ${wk(trainDate)} · ${dow(trainDate)}`}</div>
      <h2>${shortD(trainDate)}</h2>
      <div class="caret">${calOpen ? "▲ close calendar" : "▼ pick a date"}</div>
    </div>
    <button class="arrow" onclick="${calOpen?"shiftMonth(1)":"shiftDay(1)"}">›</button>
  </div>`;

  if(calOpen) h += calendarHTML();

  h += `<div class="seg">
    ${[...D.templates.map(t=>t.id), "C"].map(w=>{
      const done = sessionOn(trainDate,w);
      return `<button class="${trainWorkout===w?"on":""} ${w==="C"?"steps":""}" onclick="pickWorkout('${w}')">${esc(wLabel(w))}${done?' <span class="up">✓</span>':""}</button>`;
    }).join("")}
  </div>`;

  if(isSteps(trainWorkout)){
    const prev = lastSteps();
    const a7 = stepsAvg(7), a28 = stepsAvg(28);
    const legacy = existing && existing.cardio && (existing.cardio.minutes || existing.cardio.miles);
    h += `
    <div class="card">
      <div class="lift">
        <h3>Steps</h3>
        <span class="last">${prev ? `last: ${commas(Math.round(parseFloat(prev.steps)||0))} (${shortD(prev.date)})` : "first time"}</span>
      </div>
      <input class="num grow" style="width:100%" type="number" inputmode="numeric" placeholder="steps today"
        value="${esc(stepsDraft)}" oninput="setSteps(this.value)">
      ${a7 ? `<p class="sub" style="margin-top:8px">7-day avg ${commas(a7.avg)} over ${a7.days} logged day${a7.days===1?"":"s"}${a28?` · 28-day avg ${commas(a28.avg)}`:""}</p>` : ""}
      ${legacy ? `<p class="sub" style="margin-top:6px;color:var(--steps)">This day also has older cardio logged: ${esc(dayDetail({cardio:existing.cardio}))}. It is kept, not overwritten.</p>` : ""}
      <p class="sub" style="margin-top:6px">Read the count off your phone's Health app and type it in — iOS doesn't expose Health data to web apps.</p>
    </div>
    <button class="${justSaved?"saved":"primary"}" onclick="saveSteps()">
      ${justSaved ? "✓ Saved" : existing ? "Update steps" : "Save steps"}
    </button>`;
    return h + historyHTML();
  }

  if(!draft.length){
    return h + `<div class="empty">${esc(wLabel(trainWorkout))} has no lifts yet.<br>Add one below, or build it out on the Plan tab.</div>`
      + `<button class="ghost" style="margin-bottom:12px" onclick="addLift()">+ Add a lift to this day</button>`
      + historyHTML();
  }

  draft.forEach((d,i)=>{
    const prev = lastLiftBefore(d.name, trainDate);
    const open = !!openEx[d._uid];
    const tmpl = (tpl(trainWorkout)||{exercises:[]}).exercises.find(x=>x.name===d.name);
    h += `<div class="card">
      <div class="exhead" onclick="toggleEx('${d._uid}')">
        <div class="grow" style="min-width:0">
          <div class="exname-d">${esc(d.name||"(unnamed)")}</div>
          <div class="last" id="hint-${i}">${rowHintInner(d, prev)}</div>
        </div>
        <span class="caret">${open?"▾":"▸"}</span>
      </div>`;
    if(open){
      h += `<input class="exname" style="margin:10px 0" type="text" placeholder="Exercise name"
              value="${esc(d.name)}" oninput="setExName(${i},this.value)">`;
      if(tmpl) h += `<div class="sub" style="margin-bottom:8px">Target: ${esc(tmpl.sets)}×${esc(tmpl.reps)}</div>`;
      h += `<div class="setshead"><span>Set</span><span>lbs</span><span>reps</span><span></span></div>`;
      d.sets.forEach((s,j)=>{
        h += `<div class="setrow">
          <span class="setnum">${j+1}</span>
          <input class="num" type="number" inputmode="decimal" placeholder="lb" value="${esc(s.weight)}" oninput="setSetVal(${i},${j},'weight',this.value)">
          <input class="num" type="number" inputmode="decimal" step="any" placeholder="reps" value="${esc(s.reps)}" oninput="setSetVal(${i},${j},'reps',this.value)">
          <button class="icon" onclick="delSet(${i},${j})" ${d.sets.length===1?"disabled":""}>🗑</button>
        </div>`;
      });
      h += `<div class="row" style="margin-top:10px">
        <button class="ghost" style="flex:1" onclick="addSet(${i})">+ Add set</button>
        <button class="icon" onclick="moveDraft(${i},-1)" ${i===0?"disabled":""}>↑</button>
        <button class="icon" onclick="moveDraft(${i},1)" ${i===draft.length-1?"disabled":""}>↓</button>
        <button class="icon" onclick="removeLift(${i})">🗑</button>
      </div>`;
    }
    h += `</div>`;
  });

  h += `<button class="ghost" style="margin-bottom:12px" onclick="addLift()">+ Add a lift to this day</button>`;

  h += `<button class="${justSaved?"saved":"primary"}" onclick="saveSession()">
    ${justSaved ? "✓ Saved" : existing ? `Update ${esc(wLabel(trainWorkout))}` : `Save ${esc(wLabel(trainWorkout))}`}
  </button>`;

  return h + historyHTML();
}

  let h = `<div style="margin-top:24px"><div class="eyebrow" style="color:var(--dimmer)">History</div><div class="card" style="margin-top:8px">`;
  D.sessions.slice(0,12).forEach(s=>{
    const detail = s.workout==="C" ? dayDetail(s) : `${(s.exercises||[]).length} lifts`;

/* ============ plan view ============ */
function viewPlan(){
  const stale = !D.lastBackup || ago(D.lastBackup) > 14;
  let h = `<div class="eyebrow">The plan</div><h2>Workout templates</h2>
    <p class="sub">Build as many templates as you like. Sets and reps live here; weight gets logged per session. Steps need no template.</p>
    <div style="height:16px"></div>`;
  if(stale) h += `<div class="warn">${D.lastBackup ? `Last backup: ${ago(D.lastBackup)} days ago.` : "No backup yet."} Export one from the Backup tab.</div>`;

  // template selector
  h += `<div class="seg" style="grid-template-columns:repeat(2,1fr)">${D.templates.map(t=>
    `<button class="${planWhich===t.id?"on":""}" onclick="pickPlan('${t.id}')">${esc(t.name)} <span class="mono" style="color:var(--dimmer)">${t.exercises.length}</span></button>`
  ).join("")}</div>`;
  h += `<button class="ghost" style="margin-bottom:12px" onclick="addTemplate()">+ New template</button>`;

  const t = tpl(planWhich);
  if(!t){
    return h + `<div class="empty">No template selected.<br>Add one above to get started.</div>`;
  }

  h += `<div class="card">
    <label class="sub" style="display:block;margin-bottom:6px">Name</label>
    <input type="text" value="${esc(t.name)}" placeholder="Template name" onchange="renameTemplate('${t.id}', this.value)">
    <p class="sub" style="margin-top:8px">Editing this template only changes future workouts — anything already logged keeps what you recorded.</p>
  </div>`;

  if(t.exercises.length){
    h += `<div class="card">`;
    t.exercises.forEach((ex,i)=>{
      h += `<div class="planrow">
        <input class="exname" type="text" value="${esc(ex.name)}" onchange="editPlan(${ex.id},'name',this.value)">
        <div class="row" style="margin-top:8px">
          <input class="num sr" type="number" inputmode="numeric" value="${esc(ex.sets)}" onchange="editPlan(${ex.id},'sets',this.value)">
          <span style="color:var(--dimmer);font-size:13px">×</span>
          <input class="num sr" type="number" inputmode="numeric" value="${esc(ex.reps)}" onchange="editPlan(${ex.id},'reps',this.value)">
          <span class="grow"></span>
          <button class="icon" onclick="movePlan(${ex.id},-1)" ${i===0?"disabled":""}>↑</button>
          <button class="icon" onclick="movePlan(${ex.id},1)" ${i===t.exercises.length-1?"disabled":""}>↓</button>
          <button class="icon" onclick="delPlan(${ex.id})">🗑</button>
        </div>
      </div>`;
    });
    h += `</div>`;
  } else {
    h += `<div class="empty">${esc(t.name)} is empty.</div><div style="height:12px"></div>`;
  }

  h += `<div class="card">
    <input type="text" id="newName" placeholder="Add a lift to ${esc(t.name)}">
    <div class="row" style="margin:12px 0">
      <input class="num" style="width:64px" type="number" inputmode="numeric" id="newSets" value="3">
      <span style="color:var(--dimmer)">sets ×</span>
      <input class="num" style="width:64px" type="number" inputmode="numeric" id="newReps" value="10">
      <span style="color:var(--dimmer)">reps</span>
    </div>
    <button class="ghost" onclick="addPlan()">+ Add exercise</button>
  </div>`;

  h += `<button class="ghost" style="color:var(--bad)" onclick="deleteTemplate('${t.id}')">Delete “${esc(t.name)}” template</button>`;
  return h;
}

/* ============ weight view ============ */
function chartSVG(){
  const asc = [...D.weights].sort((a,b)=>a.date.localeCompare(b.date));
  if(asc.length < 2) return `<p class="sub" style="text-align:center;padding:24px 0">Log two weigh-ins and the graph appears.</p>`;

  // EWMA trend, weighted by elapsed DAYS rather than by measurement index, so a
  // gap between weigh-ins decays the old value the way real time would.
  // alpha is per day: the previous trend keeps (1-alpha)^Δdays of its weight.
  const alphaDay = 0.25;
  const trend = [];
  asc.forEach((w,i)=>{
    if(i===0){ trend.push(w.value); return; }
    const gap = Math.max(1, (pd(w.date).getTime()-pd(asc[i-1].date).getTime())/864e5);
    const a = 1 - Math.pow(1-alphaDay, gap);          // → 1 as the gap grows
    trend.push(a*w.value + (1-a)*trend[i-1]);
  });

  // lb/week from a linear fit over the trailing 4 weeks (falls back to all data if <2 points in window)
  const latest = pd(asc[asc.length-1].date).getTime();
  const win = asc.filter(w => (latest - pd(w.date).getTime())/864e5 <= 28);
  const reg = win.length >= 2 ? win : asc;
  const isWindow = win.length >= 2;
  const rday0 = pd(reg[0].date).getTime();
  const xs = reg.map(w => (pd(w.date).getTime()-rday0)/864e5);
  const ys = reg.map(w => w.value);
  const n = xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0),
        sxx=xs.reduce((a,b)=>a+b*b,0), sxy=xs.reduce((a,b,i)=>a+b*ys[i],0);
  const denom = n*sxx - sx*sx;
  const slopeWk = denom ? ((n*sxy - sx*sy)/denom)*7 : 0;

  const allV = [...asc.map(w=>w.value), ...trend];
  const min = Math.min(...allV)-1, max = Math.max(...allV)+1;
  const W=440,H=160,L=34,R=8,T=10,B=22;

  // x axis is elapsed time, so a gap between weigh-ins shows as a gap on the chart
  const t0 = pd(asc[0].date).getTime();
  const spanD = Math.max(1, (pd(asc[asc.length-1].date).getTime() - t0)/864e5);
  const x = ds => L + (((pd(ds).getTime()-t0)/864e5)/spanD)*(W-L-R);
  const y = v => T + (1-(v-min)/(max-min))*(H-T-B);

  const grid = [max,(max+min)/2,min].map(v=>
    `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" stroke="#262626"/>
     <text x="0" y="${(y(v)+4).toFixed(1)}" fill="#525252" font-size="10" font-family="monospace">${v.toFixed(1)}</text>`).join("");

  // faint vertical rule + label at the first of each month inside the window
  let ticks = "";
  {
    const end = pd(asc[asc.length-1].date);
    let m = new Date(pd(asc[0].date).getFullYear(), pd(asc[0].date).getMonth()+1, 1);
    while(m <= end){
      const px = x(iso(m));
      if(px > L+18 && px < W-R-18){
        ticks += `<line x1="${px.toFixed(1)}" y1="${T}" x2="${px.toFixed(1)}" y2="${H-B}" stroke="#1f1f1f"/>
          <text x="${px.toFixed(1)}" y="${H-4}" fill="#3f3f3f" font-size="9" text-anchor="middle">${MONTHS[m.getMonth()].slice(0,3)}</text>`;
      }
      m = new Date(m.getFullYear(), m.getMonth()+1, 1);
    }
  }

  const dots = asc.map(w=>`<circle cx="${x(w.date).toFixed(1)}" cy="${y(w.value).toFixed(1)}" r="2" fill="#525252"/>`).join("");
  const trendPts = trend.map((v,i)=>`${x(asc[i].date).toFixed(1)},${y(v).toFixed(1)}`).join(" ");

  const slopeStr = (slopeWk>0?"+":"") + slopeWk.toFixed(2) + " lb/wk";
  const slopeColor = slopeWk < 0 ? "var(--good)" : (slopeWk > 0 ? "var(--dim)" : "var(--dimmer)");

  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span class="sub">${isWindow ? "4-wk rate" : "rate (all data)"}</span>
      <span class="mono" style="color:${slopeColor};font-size:13px">${slopeStr}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="170">
      ${grid}
      ${ticks}
      ${dots}
      <polyline points="${trendPts}" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${L}" y="${H-4}" fill="#525252" font-size="10">${shortD(asc[0].date)}</text>
      <text x="${W-R}" y="${H-4}" fill="#525252" font-size="10" text-anchor="end">${shortD(asc[asc.length-1].date)}</text>
    </svg>
    <p class="sub" style="margin-top:4px">Gray dots are each weigh-in; the amber line is the smoothed trend. The x axis is calendar time (${Math.round(spanD)} days), so gaps between weigh-ins show as gaps.</p>
  </div>`;
}

/* ============ training phases ============
   The coach works in phases — fat loss, muscle gain, maintenance, active rest —
   each with a duration and a target rate of weight change. Holding the current
   phase in the data lets the app check the rate against the target instead of
   leaving the coach to infer intent from a trend line.

   Rates are stored as a percent of bodyweight per week, whatever units the phase
   is normally discussed in, so every comparison is one subtraction. Gain targets
   are quoted per month by convention and converted on the way in.               */
const WK_PER_MONTH = 4.345;
const PHASES = {
  cut:      { label:"Fat loss",     weeks:[8,12], dir:-1, lo:0.5,  hi:1.0 },
  gain:     { label:"Muscle gain",  weeks:[8,20], dir:1 },   // rate comes from training age
  maintain: { label:"Maintenance",  weeks:[4,8],  dir:0, lo:0, hi:0.25 },
  rest:     { label:"Active rest",  weeks:[1,2],  dir:0, lo:0, hi:0.25 }
};
const GAIN_LEVELS = {
  beginner:     { label:"Beginner — first year",   perMonth:2.0 },
  intermediate: { label:"Intermediate",            perMonth:1.0 },
  advanced:     { label:"Advanced — 5+ years",     perMonth:0.5 }
};
const CUT_MAX_LOSS_PCT = 10;     // of starting bodyweight, in one run

function latestWeight(){
  const asc = [...D.weights].sort((a,b)=>a.date.localeCompare(b.date));
  return asc.length ? asc[asc.length-1] : null;
}

// the weigh-in closest to a date, within a tolerance — used to re-anchor a phase
// when its start date moves
function weightNear(ds, maxDays){
  const t = pd(ds).getTime();
  let best = null, bd = Infinity;
  D.weights.forEach(w => {
    const d = Math.abs(pd(w.date).getTime() - t)/864e5;
    if(d <= maxDays && d < bd){ bd = d; best = w; }
  });
  return best;
}

function setPhaseStart(v){
  if(!D.phase || !v) return;
  if(v > today()){ err = "A phase can't start in the future."; render(); return; }
  D.phase.start = v;
  // the target band is a percentage of what you weighed at the start, so moving the
  // date has to move the anchor too, or the band describes a weight you never were
  const w = weightNear(v, 7);
  if(w) D.phase.startWeight = +w.value;
  err = ""; save(); render();
}

function setPhaseStartWeight(v){
  const n = parseFloat(v);
  if(!D.phase || !(n > 0)) return;
  D.phase.startWeight = n;
  save(); render();
}

function delArchivedPhase(id){
  const ph = (D.phases||[]).find(x => x.id === id);
  if(!ph) return;
  const def = PHASES[ph.type] || { label: ph.type };
  if(!confirm(`Delete the ${def.label.toLowerCase()} phase from ${ph.start} to ${ph.end}? Your weigh-ins and food log are untouched.`)) return;
  D.phases = D.phases.filter(x => x.id !== id);
  save(); render();
}

function startPhase(type, level){
  const def = PHASES[type];
  if(!def) return;
  const w = latestWeight();
  if(!w){ err = "Log a bodyweight first — a phase needs a starting point."; render(); return; }
  if(D.phase) endPhase(true);
  let lo = def.lo, hi = def.hi;
  if(type === "gain"){
    const g = GAIN_LEVELS[level] || GAIN_LEVELS.intermediate;
    const target = g.perMonth / WK_PER_MONTH;
    lo = target*0.6; hi = target*1.4;          // a band around the target, not a knife edge
  }
  D.phase = { id:uid("ph"), type, level: type==="gain" ? (level||"intermediate") : null,
              start: today(), startWeight: +w.value, loPctWk: lo, hiPctWk: hi };
  save(); render();
}

function endPhase(silent){
  if(!D.phase) return;
  if(!silent && !confirm("End this phase? It moves to your history and the coach can still see it.")) return;
  const w = latestWeight();
  D.phases.push(Object.assign({}, D.phase, { end: today(), endWeight: w ? +w.value : null }));
  if(D.phases.length > 12) D.phases = D.phases.slice(-12);
  D.phase = null;
  if(!silent){ save(); render(); }
}

// observed rate across the phase so far, with its uncertainty
function phaseProgress(ph){
  if(!ph) return null;
  const startMs = pd(ph.start).getTime(), end = pd(today()).getTime();
  const weeks = Math.max(0, (end - startMs)/6048e5);
  const pts = weightsIn(startMs - 864e5, end);
  const fit = pts.length >= 3 ? ols(pts) : null;
  const w = latestWeight();
  const now = w ? +w.value : null;
  const changed = now != null ? now - ph.startWeight : null;
  const loLb = ph.loPctWk/100 * ph.startWeight, hiLb = ph.hiPctWk/100 * ph.startWeight;
  const perWeek = fit ? fit.slope*7 : (weeks > 0.5 && changed != null ? changed/weeks : null);
  const dir = PHASES[ph.type] ? PHASES[ph.type].dir : 0;
  // signed so that "toward the goal" is always positive
  const toward = perWeek == null ? null : (dir === 0 ? -Math.abs(perWeek) : dir*perWeek);
  return {
    weeks, perWeek, toward, changed, now, loLb, hiLb, dir,
    se: fit ? fit.se*7 : null,
    pctChanged: changed != null ? Math.abs(changed)/ph.startWeight*100 : null
  };
}

function phaseWarnings(ph, pr){
  const def = PHASES[ph.type], out = [];
  if(!pr) return out;
  if(pr.weeks > def.weeks[1])
    out.push(`Week ${Math.floor(pr.weeks)+1} — past the ${def.weeks[1]}-week mark for a ${def.label.toLowerCase()} phase.`);
  if(ph.type === "cut" && pr.pctChanged != null && pr.changed < 0 && pr.pctChanged >= CUT_MAX_LOSS_PCT)
    out.push(`Down ${pr.pctChanged.toFixed(1)}% of starting bodyweight — at or past the ${CUT_MAX_LOSS_PCT}% a single phase should give up.`);
  if(pr.toward != null && pr.weeks >= 2){
    if(pr.dir !== 0 && pr.toward > pr.hiLb) out.push(`Moving ${Math.abs(pr.perWeek).toFixed(2)} lb/week, faster than the ${pr.hiLb.toFixed(2)} lb top of the target band.`);
    if(pr.dir !== 0 && pr.toward < pr.loLb) out.push(`Moving ${Math.abs(pr.perWeek).toFixed(2)} lb/week, under the ${pr.loLb.toFixed(2)} lb bottom of the band.`);
    if(pr.dir === 0 && Math.abs(pr.perWeek) > pr.hiLb) out.push(`Drifting ${Math.abs(pr.perWeek).toFixed(2)} lb/week — more than a maintenance block should.`);
  }
  return out;
}

function phaseHistoryCard(){
  const hist = D.phases || [];
  if(!hist.length) return "";
  let h = `<div class="card">
    <div class="lift"><h3>Phase history</h3><span class="last">${hist.length}</span></div>`;
  [...hist].reverse().forEach(ph => {
    const def = PHASES[ph.type] || { label: ph.type };
    const wks = Math.max(0, Math.round((pd(ph.end).getTime() - pd(ph.start).getTime())/6048e5));
    const ch = ph.endWeight != null ? ph.endWeight - ph.startWeight : null;
    h += `<div class="list-row">
      <span style="font-size:14px;min-width:0">${def.label}
        <span class="sub">· ${shortD(ph.start)}–${shortD(ph.end)} · ${wks} wk${
          ch != null ? ` · ${ch>0?"+":""}${ch.toFixed(1)} lb` : ""}</span></span>
      <button class="icon" onclick="delArchivedPhase('${ph.id}')">🗑</button>
    </div>`;
  });
  return h + `</div>`;
}

function phaseCard(){
  const ph = D.phase;
  if(!ph){
    let h = `<div class="card">
      <div class="lift"><h3>Phase</h3><span class="last">none running</span></div>
      <p class="sub" style="margin:6px 0 10px">Start one and the app tracks week count, target rate and total change against it, and the coach stops having to guess what you are doing.</p>
      <div class="row" style="flex-wrap:wrap">
        <button class="ghost grow" onclick="startPhase('cut')">Fat loss</button>
        <button class="ghost grow" onclick="pickGainLevel()">Muscle gain</button>
      </div>
      <div class="row" style="flex-wrap:wrap;margin-top:8px">
        <button class="ghost grow" onclick="startPhase('maintain')">Maintenance</button>
        <button class="ghost grow" onclick="startPhase('rest')">Active rest</button>
      </div>`;
    return h + `</div>`;
  }
  const def = PHASES[ph.type], pr = phaseProgress(ph);
  const wk = Math.floor(pr.weeks) + 1;
  const arrow = def.dir < 0 ? "−" : def.dir > 0 ? "+" : "±";
  let h = `<div class="card">
    <div class="lift"><h3>${def.label}</h3><span class="last">week ${wk} of ${def.weeks[0]}–${def.weeks[1]}</span></div>
    <div class="row" style="margin-top:10px">
      <span class="sub" style="white-space:nowrap">started</span>
      <input type="date" class="grow" value="${ph.start}" max="${today()}" onchange="setPhaseStart(this.value)">
      <input class="num" style="width:80px" type="number" inputmode="decimal" step="0.1"
             value="${ph.startWeight}" onchange="setPhaseStartWeight(this.value)">
      <span class="sub">lb</span>
    </div>
    <div class="sub" style="margin-top:8px;line-height:1.7">
      ${ph.level ? GAIN_LEVELS[ph.level].label + "<br>" : ""}Target ${arrow}${pr.loLb.toFixed(2)}–${pr.hiLb.toFixed(2)} lb/week${
        ph.type==="gain" ? ` (${GAIN_LEVELS[ph.level].perMonth}% of bodyweight a month)` :
        ph.type==="cut" ? ` (${ph.loPctWk}–${ph.hiPctWk}% of bodyweight a week)` : ""}<br>
      ${pr.perWeek != null
        ? `Actual ${pr.perWeek>0?"+":""}${pr.perWeek.toFixed(2)} lb/week${pr.se!=null?` ± ${pr.se.toFixed(2)}`:""}`
        : "Actual — not enough weigh-ins yet"}${
        pr.changed != null ? ` · ${pr.changed>0?"+":""}${pr.changed.toFixed(1)} lb overall (${pr.pctChanged.toFixed(1)}%)` : ""}
    </div>`;
  phaseWarnings(ph, pr).forEach(w => {
    h += `<p class="sub" style="margin-top:8px;color:var(--bad)">${esc(w)}</p>`;
  });
  return h + `<button class="ghost" style="margin-top:10px" onclick="endPhase()">End this phase</button></div>`;
}

function pickGainLevel(){
  const keys = Object.keys(GAIN_LEVELS);
  const msg = "How long have you been training consistently?\n\n"
    + keys.map((k,i)=>`${i+1}. ${GAIN_LEVELS[k].label} — aim for ${GAIN_LEVELS[k].perMonth}% of bodyweight a month`).join("\n")
    + "\n\nEnter 1, 2 or 3:";
  const a = prompt(msg, "2");
  const i = parseInt(a, 10);
  if(!(i >= 1 && i <= keys.length)) return;
  startPhase("gain", keys[i-1]);
}

/* ============ maintenance calories ============
   Inverting the energy balance over a window: TDEE = mean intake - k*(lb/week)/7,
   with the weight slope signed, so losing adds and gaining subtracts. k is the
   energy density of the tissue moved — adipose is around 3500 kcal/lb, mixed lean
   gain nearer 3000 because lean tissue is mostly water.

   The constant is not what limits this. Precision is: the standard error of a
   fitted slope falls roughly as T^1.5, so three weeks of a slow bulk gives an
   error bar wider than the signal. So the window is chosen by the confidence it
   buys rather than by which phase you happen to be in, and no number is presented
   as usable until the interval is tight enough to act on.                        */
const K_LOSS = 3500, K_GAIN = 3000;        // kcal per lb of tissue
const TDEE_WINDOWS = [21, 28, 42, 56, 70, 84];
const TDEE_SE_TARGET = 100;                // kcal/day — the bar for calling it usable
const TDEE_MIN_WEIGHTS = 8, TDEE_MIN_DAYS = 14, TDEE_MIN_COVERAGE = 0.6;

// ordinary least squares through {x: day, y: lb}, returning the slope and its
// standard error; raw weigh-ins, never the EWMA, whose smoothing would understate it
function ols(pts){
  const n = pts.length;
  if(n < 3) return null;
  let sx = 0, sy = 0;
  pts.forEach(p => { sx += p.x; sy += p.y; });
  const mx = sx/n, my = sy/n;
  let sxx = 0, sxy = 0;
  pts.forEach(p => { sxx += (p.x-mx)*(p.x-mx); sxy += (p.x-mx)*(p.y-my); });
  if(sxx <= 0) return null;
  const b = sxy/sxx, a = my - b*mx;
  let ss = 0;
  pts.forEach(p => { const r = p.y - (a + b*p.x); ss += r*r; });
  const s2 = ss/(n-2);
  return { slope:b, se: Math.sqrt(s2/sxx), n };
}

function weightsIn(fromMs, toMs){
  return D.weights
    .map(w => ({ t: pd(w.date).getTime(), y: +w.value }))
    .filter(w => w.t > fromMs && w.t <= toMs && isFinite(w.y))
    .sort((a,b) => a.t - b.t)
    .map(w => ({ x: (w.t - fromMs)/864e5, y: w.y }));
}

function tdeeOver(days){
  const end = pd(today()).getTime(), start = end - days*864e5;
  const pts = weightsIn(start, end);
  if(pts.length < TDEE_MIN_WEIGHTS) return null;
  const fit = ols(pts);
  if(!fit) return null;

  const logged = [];
  for(let i = 1; i <= days; i++){
    const ds = iso(new Date(start + i*864e5));
    if(dayEntries(ds).length) logged.push(ds);
  }
  if(logged.length < TDEE_MIN_DAYS) return null;
  const intake = logged.reduce((a,ds) => a + dayTotals(ds).cal, 0) / logged.length;

  const perWeek = fit.slope*7, seWeek = fit.se*7;
  const k = perWeek < 0 ? K_LOSS : K_GAIN;
  return {
    days, weighIns: pts.length, loggedDays: logged.length, coverage: logged.length/days,
    perWeek, seWeek, intake, k,
    tdee: intake - k*perWeek/7,
    se: k*seWeek/7
  };
}

// shortest window that clears the confidence bar; failing that, the longest one
// there is data for, shown as not yet usable
function tdeeEstimate(){
  let longest = null;
  for(const d of TDEE_WINDOWS){
    const r = tdeeOver(d);
    if(!r) continue;
    longest = r;
    if(r.coverage >= TDEE_MIN_COVERAGE && r.se <= TDEE_SE_TARGET)
      return Object.assign(r, { confident:true });
  }
  return longest ? Object.assign(longest, { confident:false }) : null;
}

function tdeeCard(){
  const e = tdeeEstimate();
  if(!e) return `<div class="card">
    <div class="lift"><h3>Maintenance calories</h3><span class="last">not yet</span></div>
    <p class="sub" style="margin-top:8px">Measured from your own data rather than a formula, once there is enough of it: at least ${TDEE_MIN_WEIGHTS} weigh-ins and ${TDEE_MIN_DAYS} logged days inside the same three weeks.</p>
  </div>`;
  const rate = e.perWeek;
  const dir = rate < -0.05 ? "losing" : rate > 0.05 ? "gaining" : "holding";
  const body = `<div class="sub" style="margin-top:8px;line-height:1.6">
      Over the last ${e.days} days: ${e.weighIns} weigh-ins, ${e.loggedDays} logged days (${Math.round(e.coverage*100)}%).<br>
      Averaging ${commas(Math.round(e.intake))} cal a day while ${dir} ${Math.abs(rate).toFixed(2)} lb/week.
    </div>`;
  if(e.confident) return `<div class="card">
    <div class="lift"><h3>Maintenance calories</h3><span class="last">±${Math.round(e.se)}</span></div>
    <h2 class="mono" style="margin:6px 0 0">${commas(Math.round(e.tdee/10)*10)} <span class="sub" style="font-size:13px">cal/day</span></h2>
    ${body}
    <p class="sub" style="margin-top:8px;color:var(--dimmer)">Assumes ${e.k} cal per lb of tissue moved. Your logging bias mostly cancels: if you under-record intake, this reads low by the same amount, so a deficit set against it still comes out about right.</p>
  </div>`;
  return `<div class="card">
    <div class="lift"><h3>Maintenance calories</h3><span class="last">too noisy</span></div>
    <h2 class="mono" style="margin:6px 0 0;color:var(--dim)">~${commas(Math.round(e.tdee/10)*10)} <span class="sub" style="font-size:13px">± ${Math.round(e.se)} cal/day</span></h2>
    ${body}
    <p class="sub" style="margin-top:8px;color:var(--dimmer)">The error bar is wider than ${TDEE_SE_TARGET} cal, so this is not worth acting on yet. It narrows quickly: the uncertainty on a weight trend falls faster than the window grows, and a slow gain needs six to eight weeks before the signal clears the noise.</p>
  </div>`;
}

/* ============ backup view ============ */
/* What is actually on disk, and how fast it is filling up. Safari caps localStorage at
   about 5 MB of text per origin; WebKit bills UTF-16, so the worst case is 2.5 M
   characters. Counting characters and comparing against that lower bound is the
   pessimistic reading, which is the one worth showing.                            */
const STORAGE_BUDGET = 2.5*1048576;   // 2.5 M characters
const kb = n => n < 1024 ? n + " B" : (n/1024).toFixed(n < 102400 ? 1 : 0) + " KB";

function preSnapshotCard(){
  const snap = preSnapshot();
  if(!snap) return "";
  return `<div class="card">
    <div class="lift"><h3>Before the last upgrade</h3><span class="last">${esc(snap.at)}</span></div>
    <p class="sub" style="margin:6px 0 10px;line-height:1.5">A copy of your data is kept automatically whenever the app upgrades its format — this one was taken going from v${snap.from} to v${snap.to}. It exists so a rolled-back app has something to fall back on. Restoring loses anything logged since that date.</p>
    <button class="ghost" onclick="restorePreSnapshot()">Roll back to this copy</button>
  </div>`;
}

function storageStats(){
  const len = k => { try{ const v = localStorage.getItem(k); return v ? v.length : 0; }catch(e){ return 0; } };
  const core = len(KEY), scratch = len(SCRATCH_KEY), snap = len(PRE_KEY);
  const log = JSON.stringify(NUT().log||{}).length;
  const sessions = JSON.stringify(D.sessions||[]).length;
  const foods = JSON.stringify(NUT().foods||[]).length;

  // growth rate measured over the span actually logged, not calendar days since install
  const days = Object.keys(NUT().log||{}).filter(d=>dayEntries(d).length).sort();
  const sdates = (D.sessions||[]).map(x=>x.date).sort();
  const first = [days[0], sdates[0]].filter(Boolean).sort()[0];
  const span = first ? Math.max(1, (pd(today()) - pd(first))/864e5) : 0;
  const perDay = span ? (log + sessions) / span : 0;
  const left = STORAGE_BUDGET - (core + scratch + snap);
  return { core, scratch, snap, log, sessions, foods, total:core+scratch+snap, perDay,
           years: perDay > 0 ? left / perDay / 365 : null };
}

function storageCard(){
  const st = storageStats();
  const pct = Math.min(100, st.total / STORAGE_BUDGET * 100);
  const life = st.years == null ? "Not enough history yet to estimate a growth rate."
    : st.years > 40 ? `Growing about ${kb(Math.round(st.perDay))} a day — effectively no limit at that rate.`
    : `Growing about ${kb(Math.round(st.perDay))} a day, which reaches the budget in roughly ${st.years < 1 ? Math.round(st.years*12) + " months" : st.years.toFixed(1) + " years"}.`;
  return `<div class="card">
    <div class="lift"><h3>Storage</h3><span class="last">${(pct).toFixed(pct<1?2:1)}%</span></div>
    <div class="bar" style="margin:10px 0 8px"><div style="width:${Math.max(pct,0.5)}%;background:var(--accent)"></div></div>
    <div class="sub">${kb(st.total)} of a ${(STORAGE_BUDGET/1048576).toFixed(1)} MB budget</div>
    <div class="sub" style="margin-top:8px;line-height:1.6">
      diet log ${kb(st.log)} · training ${kb(st.sessions)} · your foods ${kb(st.foods)}<br>
      in progress ${kb(st.scratch)} · pre-upgrade copy ${kb(st.snap)}
    </div>
    <p class="sub" style="margin-top:8px;line-height:1.5">${life}</p>
    <p class="sub" style="margin-top:8px;line-height:1.5;color:var(--dimmer)">Safari allows roughly 5 MB of text per site and may count each character as two bytes, so this compares against the pessimistic 2.5 MB. Exports are unaffected by the limit.</p>
  </div>`;
}

function cloudBackupCard(){
  const when = syncState.at ? new Date(syncState.at) : null;
  const mins = when ? Math.floor((Date.now() - syncState.at)/60000) : null;
  const rel  = mins === null ? "" : mins < 1 ? "just now" : mins < 60 ? `${mins} min ago`
             : mins < 1440 ? `${Math.floor(mins/60)} h ago` : `${Math.floor(mins/1440)} d ago`;
  let h = `<div style="height:20px"></div><div class="eyebrow">Automatic</div><h2>Cloud backup</h2><div style="height:12px"></div>`;

  if(!syncCode){
    h += `<div class="card" style="font-size:13px;color:var(--dim);line-height:1.5">
      Off. Set an access code and the app will send a copy of everything to your own
      Cloudflare account every few minutes, keeping the last 14 days.
      <b>Write the code down somewhere outside this app</b> — it is the only thing that
      identifies which backup is yours.
    </div>`;
  } else if(blocked){
    h += `<div class="warn" style="font-size:13px">Paused. The app could not read its saved data, so it will not
      send anything to the cloud — the copy up there is the good one and must not be written over.</div>`;
  } else {
    const cls = syncState.ok === false ? "warn" : "card";
    h += `<div class="${cls}" style="font-size:13px;line-height:1.5;color:${syncState.ok===false?"":"var(--dim)"}">
      ${syncState.at === null ? "On. Nothing sent yet."
        : syncState.ok ? `Last sent ${rel} · ${esc(syncState.msg)}${syncDirty ? " · changes waiting" : ""}`
                       : `Last attempt ${rel} failed: ${esc(syncState.msg)}`}
    </div>
    <button class="ghost" onclick="cloudBackup(true)" ${syncBusy?"disabled":""} style="margin-bottom:8px">${syncBusy?"Working…":"⬆ Send a copy now"}</button>
    <button class="ghost" onclick="cloudRefreshList()" ${syncBusy?"disabled":""} style="margin-bottom:12px">☁ Show cloud backups</button>`;

    if(syncList && syncList.length){
      h += `<div class="card" style="padding:0">`;
      h += syncList.map(b => `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)">
          <div><div style="font-size:14px">${esc(shortD(b.date))}</div>
          <div class="sub">${b.bytes ? Math.round(b.bytes/1024)+" KB" : ""}</div></div>
          <button class="ghost" style="margin:0;width:auto;padding:6px 10px;font-size:12px" onclick="cloudRestore('${esc(b.date)}')">Restore</button>
        </div>`).join("");
      h += `</div>`;
    }
  }

  h += `<div style="height:8px"></div>
    <label class="sub" style="display:block;margin-bottom:6px">Access code</label>
    <input type="text" id="syncCodeInput" autocapitalize="off" autocorrect="off" spellcheck="false"
      placeholder="12+ characters, letters and numbers" value="${esc(syncCode)}" style="margin-bottom:8px">
    <button class="ghost" onclick="saveSyncCode()">${syncCode ? "Update code" : "Turn on cloud backup"}</button>
    <p class="sub" style="margin-top:10px;line-height:1.5">
      The code is stored on this device only and is never included in an export.
      Anyone with the code can read and overwrite this backup, so use a long random one
      and keep it in a password manager. Each person using the app needs their own.
    </p>`;
  return h;
}

function viewBackup(){
