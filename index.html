  refreshHint(i); writeScratch();
}
function addSet(i){ draft[i].sets.push({weight:"",reps:""}); justSaved=false; writeScratch(); render(); }
function delSet(i,j){ if(draft[i].sets.length>1){ draft[i].sets.splice(j,1); justSaved=false; writeScratch(); render(); } }
function setSteps(v){ stepsDraft = v; justSaved=false; }
function addLift(){
  const row = withUid({ name:"", sets:[{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""}] });
  draft.push(row); openEx[row._uid] = true; justSaved=false; writeScratch(); render();
}
function removeLift(i){ draft.splice(i,1); justSaved=false; writeScratch(); render(); }
function moveDraft(i,dir){
  const j = i + dir;
  if(j < 0 || j >= draft.length) return;
  [draft[i], draft[j]] = [draft[j], draft[i]];
  justSaved = false; writeScratch(); render();
}

function saveSession(){
  const exercises = draft
    .map(r => ({ name:(r.name||"").trim(), sets: r.sets.filter(s => s.weight!=="" || s.reps!=="").map(s=>({weight:s.weight,reps:s.reps})) }))
    .filter(r => r.name !== "" && r.sets.length);
  if(!exercises.length){ err="Enter at least one set before saving."; render(); return; }
  D.sessions = [...D.sessions.filter(s => !(s.date===trainDate && s.workout===trainWorkout)),
                { date:trainDate, workout:trainWorkout, exercises }]
                .sort((a,b)=>b.date.localeCompare(a.date));
  if(D.scratch) delete D.scratch[scratchKey()];   // committed — clear the unsaved copy
  save(); saveScratch(); justSaved=true; render();
}

function saveSteps(){
  const n = parseFloat(stepsDraft);
  if(!(n > 0)){ err="Enter a step count."; render(); return; }
  const old = sessionOn(trainDate, "C") || {};
  const rec = { date:trainDate, workout:"C", steps: Math.round(n) };
  if(old.cardio) rec.cardio = old.cardio;          // keep anything logged under the old Cardio slot
  D.sessions = [...D.sessions.filter(s => !(s.date===trainDate && s.workout==="C")), rec]
                .sort((a,b)=>b.date.localeCompare(a.date));
  save(); justSaved=true; render();
}

function delSession(date,w){
  if(!confirm(`Delete ${wLabel(w)} on ${shortD(date)}?`)) return;
  D.sessions = D.sessions.filter(s => !(s.date===date && s.workout===w));
  save(); seedDraft(); render();
}

function pickPlan(w){ planWhich = w; render(); }
function addTemplate(){
  const id = "t" + Date.now();
  D.templates.push({ id, name:"New workout", exercises:[] });
  planWhich = id;
  save(); render();
}
function renameTemplate(id, v){
  const t = tpl(id);
  if(t){ t.name = v.trim() || "Workout"; save(); render(); }
}
function deleteTemplate(id){
  const t = tpl(id);
  if(!t) return;
  const used = D.sessions.some(s => s.workout === id);
  const msg = used
    ? `Delete the “${t.name}” template? Sessions you already logged under it stay in your history — you just can't start new ones from it.`
    : `Delete the “${t.name}” template?`;
  if(!confirm(msg)) return;
  D.templates = D.templates.filter(x => x.id !== id);
  ensureSelection();
  save(); seedDraft(); render();
}
function addPlan(){
  const t = tpl(planWhich); if(!t) return;
  const name = document.getElementById("newName").value.trim();
  if(!name) return;
  const sets = document.getElementById("newSets").value || "3";
  const reps = document.getElementById("newReps").value || "10";
  t.exercises.push({ id:Date.now(), name, sets, reps });
  save(); seedDraft(); render();
}
function editPlan(id,f,v){
  const t = tpl(planWhich); if(!t) return;
  t.exercises = t.exercises.map(ex => ex.id===id ? {...ex,[f]:v} : ex);
  save(); seedDraft();
}
function delPlan(id){
  const t = tpl(planWhich); if(!t) return;
  t.exercises = t.exercises.filter(ex => ex.id!==id);
  save(); seedDraft(); render();
}
function movePlan(id,dir){
  const t = tpl(planWhich); if(!t) return;
  const i = t.exercises.findIndex(e=>e.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=t.exercises.length) return;
  [t.exercises[i], t.exercises[j]] = [t.exercises[j], t.exercises[i]];
  save(); seedDraft(); render();
}

function addWeight(){
  const date = document.getElementById("wDate").value;
  const val = parseFloat(document.getElementById("wVal").value);
  if(!date || isNaN(val)) return;
  D.weights = [...D.weights.filter(w=>w.date!==date), {date,value:val}].sort((a,b)=>b.date.localeCompare(a.date));
  save(); render();
}
function delWeight(date){ D.weights = D.weights.filter(w=>w.date!==date); save(); render(); }

async function exportAll(){
  note = "";
  try{
    const blob = new Blob([JSON.stringify({app:"gymlog",version:SCHEMA,exported:today(),data:D})],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `gym-backup-${today()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    D.lastBackup = today(); save();
    note = "Exported. In the share sheet choose Save to Files → iCloud Drive.";
  }catch(e){ err = "Export failed. Try again."; }
  render();
}
/* One restore path, used by both the file picker and the cloud list, so a cloud
   restore gets the same version check and the same migration as a file does.
   Throws before anything is written; a NewerBackup is reported, not applied. */
function NewerBackup(v){ this.v = v; }
function applyBackupObject(parsed){
  if(!parsed || !parsed.data) throw new Error("bad file");
  const v = Number(parsed.version) || Number(parsed.data.schema) || 1;
  if(v > SCHEMA) throw new NewerBackup(v);
  const upgraded = migrate(Object.assign({}, parsed.data, { schema:v }));   // throws before anything is written
  D = upgraded;
  blocked = null;                     // a good file supersedes whatever we couldn't read
  save(); saveScratch(); invalidateFoods(); invalidateLogStats(); ensureSelection(); seedDraft();
  return v;
}
const newerMsg = v => `That backup was written by a newer version of the app (v${v}). Update the app first — the backup is fine, and nothing has been changed.`;
const restoredMsg = v => v < SCHEMA ? `Restored from a v${v} backup and upgraded to v${SCHEMA}.` : "Restored from backup.";

async function importAll(e){
  const file = e.target.files[0];
  if(!file) return;
  note = "";
  try{
    const v = applyBackupObject(JSON.parse(await file.text()));
    note = restoredMsg(v);
  }
  catch(ex){
    err = ex instanceof NewerBackup ? newerMsg(ex.v)
                                    : "That file isn't a gym backup, or it's damaged. Nothing was changed.";
  }
  e.target.value = "";
  render();
}

/* ============ cloud backup ============
   localStorage stays the source of truth. This is a copy pushed to a Worker that files
   it under today's date, keeping a fortnight of daily copies. Nothing here ever reads
   from the cloud on its own — restoring is always something you ask for.  */
function loadSyncSettings(){
  try{
    syncCode = localStorage.getItem(SYNC_CODE_LS) || "";
    const s = localStorage.getItem(SYNC_STATE_LS);
    if(s) syncState = JSON.parse(s);
  }catch(e){}
}
function saveSyncState(){ try{ localStorage.setItem(SYNC_STATE_LS, JSON.stringify(syncState)); }catch(e){} }
function saveSyncCode(){
  const raw = (document.getElementById("syncCodeInput").value || "").trim();
  if(raw && !/^[A-Za-z0-9._-]{12,80}$/.test(raw)){
    err = "The access code must be 12–80 characters, letters/numbers/dot/dash/underscore only.";
    render(); return;
  }
  syncCode = raw;
  try{ raw ? localStorage.setItem(SYNC_CODE_LS, raw) : localStorage.removeItem(SYNC_CODE_LS); }catch(e){}
  syncList = null; err = ""; note = raw ? "Access code saved. Backing up now…" : "Cloud backup turned off.";
  render();
  if(raw) cloudBackup(true);
}

async function cloudBackup(manual){
  // Rule 1: if the saved data could not be read, this copy of D is not the real one.
  // Uploading it would put a wrong copy on top of a right one.
  if(blocked || !syncCode || syncBusy) return;
  if(!manual && !syncDirty) return;
  if(!manual && syncState.at && Date.now() - syncState.at < SYNC_EVERY) return;
  syncBusy = true;
  const payload = JSON.stringify({app:"gymlog",version:SCHEMA,exported:today(),data:D});
  try{
    const res = await fetch(SYNC_URL, {
      method: "POST",
      headers: { "content-type":"application/json", "x-gym-code": syncCode },
      body: payload
    });
    const out = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(out.error || ("HTTP " + res.status));
    syncDirty = false;
    syncList = null;                                     // the date list just changed
    syncState = { at: Date.now(), ok: true, msg: `${Math.round(payload.length/1024)} KB` };
  }catch(e){
    syncState = { at: Date.now(), ok: false, msg: String((e && e.message) || e) };
  }
  syncBusy = false;
  saveSyncState();
  if(manual) render();
}

async function cloudRefreshList(){
  if(!syncCode || syncBusy) return;
  syncBusy = true; err = ""; note = "";
  try{
    const res = await fetch(SYNC_URL, { headers:{ "x-gym-code": syncCode } });
    const out = await res.json();
    if(!res.ok) throw new Error(out.error || ("HTTP " + res.status));
    syncList = out.backups || [];
    if(!syncList.length) note = "No cloud backups yet under that access code.";
  }catch(e){ err = "Couldn't reach the cloud backup: " + ((e && e.message) || e); }
  syncBusy = false;
  render();
}

async function cloudRestore(date){
  if(!syncCode || syncBusy) return;
  if(!confirm(`Replace everything in the app with the ${date} cloud backup?\n\nWhat is in the app now will be gone.`)) return;
  syncBusy = true; err = ""; note = "";
  try{
    const res = await fetch(SYNC_URL + "?date=" + encodeURIComponent(date), { headers:{ "x-gym-code": syncCode } });
    const out = await res.json();
    if(!res.ok) throw new Error(out.error || ("HTTP " + res.status));
    const v = applyBackupObject(out);
    note = restoredMsg(v) + ` (cloud copy from ${date})`;
  }catch(e){
    err = e instanceof NewerBackup ? newerMsg(e.v)
                                   : "Restore failed: " + ((e && e.message) || e) + ". Nothing was changed.";
  }
  syncBusy = false;
  render();
}

/* ============ recovery ============ */
function viewBlocked(){
  const snap = preSnapshot();
  const newer = blocked.kind === "newer";
  let h = `<div class="card">
    <div class="lift"><h3>${newer ? "This app is out of date" : "Saved data couldn't be read"}</h3></div>
    <p class="sub" style="margin-top:8px;line-height:1.6">${newer
      ? `Your data was written by version ${esc(blocked.version)} of the app, and this copy only understands up to ${SCHEMA}. That happens when the page is served from an older build — reload, and if that doesn't fix it, the deployed file needs to go back to the newer version.`
      : `The saved data is present but not valid. Nothing has been changed.`}</p>
    <p class="sub" style="margin-top:8px;line-height:1.6;color:var(--accent)">Nothing is being written while this message is showing, so your data is exactly as you left it. Don't clear the app or reinstall it.</p>
    ${newer ? `<button class="primary" style="margin-top:12px" onclick="reloadFresh()">Reload the app</button>` : ""}
    <button class="${newer ? "ghost" : "primary"}" style="margin-top:8px" onclick="downloadRaw()">Save a copy of the data to a file</button>`;
  if(snap) h += `<button class="ghost" style="margin-top:8px" onclick="restorePreSnapshot()">Roll back to the ${esc(snap.at)} copy (before the v${snap.from} → v${snap.to} upgrade)</button>`;
  h += `<input type="file" accept="application/json" id="impFile" class="hide" onchange="importAll(event)">
    <button class="ghost" style="margin-top:8px" onclick="document.getElementById('impFile').click()">Restore from a backup file</button>
  </div>`;
  if(note) h += `<div class="ok">${esc(note)}</div>`;
  return h;
}

/* ============ render ============ */
function render(){
  // remember which text field was focused, so a re-render doesn't drop the keyboard mid-type
  const act = document.activeElement;
  let focus = null;
  if(act && act.id && act.tagName === "INPUT"){
    let sel = null;
    try { sel = { s:act.selectionStart, e:act.selectionEnd }; } catch(_) {}
    focus = { id:act.id, sel };
  }

  if(blocked){
    // no tabs: every other screen can write, and writing is the one thing to avoid here
    document.getElementById("app").innerHTML = (err ? `<div class="err">${esc(err)}</div>` : "") + viewBlocked();
    document.getElementById("nav").innerHTML = "";
    return;
  }
  const views = { train:viewTrain, plan:viewPlan, diet:viewDiet, weight:viewWeight, summary:viewSummary, backup:viewBackup };
  document.getElementById("app").innerHTML =
    (err ? `<div class="err">${esc(err)}</div>` : "") + views[tab]();
  document.getElementById("nav").innerHTML =
    [["train","Train"],["plan","Plan"],["diet","Diet"],["weight","Weight"],["summary","Summary"],["backup","Backup"]]
    .map(([id,label]) => `<button class="${tab===id?"on":""}" onclick="go('${id}')">${label}</button>`).join("");

  if(focus){
    const el = document.getElementById(focus.id);
    if(el){ el.focus(); if(focus.sel){ try { el.setSelectionRange(focus.sel.s, focus.sel.e); } catch(_) {} } }
  }
  TIMER.sync();
  TIMER.draw();
}
function go(t){ err=""; note=""; tab=t; if(t==="train") seedDraft(); render(); }

// swipe right on a meal (in the diet day view) copies yesterday's items for that meal
let swMeal=null, swX=0, swY=0;
document.addEventListener("touchstart", e=>{
  const m = e.target.closest && e.target.closest("[data-meal]");
  if(m){ swMeal = m.getAttribute("data-meal"); swX = e.touches[0].clientX; swY = e.touches[0].clientY; }
  else swMeal = null;
}, {passive:true});
document.addEventListener("touchend", e=>{
  if(!swMeal) return;
  const dx = e.changedTouches[0].clientX - swX;
  const dy = Math.abs(e.changedTouches[0].clientY - swY);
  if(dx > 60 && dy < 40){ copyYesterdayMeal(swMeal); }
  swMeal = null;
}, {passive:true});

load();
// a stale cached build navigates away here rather than starting up
if(!selfHealStaleBuild()){
  loadAiSettings();
  ensureSelection();
  seedDraft();
  render();
  loadLibrary();                  // async — the UI is usable immediately, foods appear when it lands

  // iOS can suspend or kill a backgrounded web app with no further events, so commit
  // any debounced write the moment the app stops being visible
  addEventListener("pagehide", flushPending);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushPending(); });

  /* Cloud backup runs on a timer while the app is open rather than on the way out:
     iOS gives a backgrounded web app almost no time to finish a request, and a body
     this size will not survive that window. Backgrounding still triggers an attempt,
     but nothing depends on it landing. */
  loadSyncSettings();
  setTimeout(()=>cloudBackup(true), 4000);              // once, shortly after launch
  setInterval(()=>cloudBackup(false), SYNC_EVERY);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden") cloudBackup(false);
    else cloudBackup(false);
  });
}
</script>
